<style>
/* Shell: one login, two apps (Daily Inspection + Night Shift Plan) in tabs.
   Both apps live in same-origin iframes; the shell signs in to both back ends and leaves each app's session in localStorage. */
:root{--bg:#F2F2F7;--card:#fff;--label:#000;--label2:rgba(60,60,67,.62);--sep:rgba(60,60,67,.29);--tint:#007AFF;--red:#D70015;
  --bar:rgba(249,249,249,.94);color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Leelawadee UI","Noto Sans Thai",sans-serif;color:var(--label);-webkit-font-smoothing:antialiased}
/* layout: top bar (phone) / fixed side menu (computer) + the selected app */
:root{--side:256px;--top:52px;--brand:#D7263D;--brand2:#FF5A5F;--navy:#1E2B4A}
.topbar{position:fixed;top:0;left:0;right:0;height:calc(var(--top) + env(safe-area-inset-top));padding-top:env(safe-area-inset-top);
  display:flex;align-items:center;gap:6px;padding-left:6px;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid var(--sep);z-index:12}
.topbar b{font-size:1rem;font-weight:600}
.iconbtn{width:44px;height:44px;border:0;background:none;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--navy);cursor:pointer}
.iconbtn:active{background:rgba(0,0,0,.06)}
.iconbtn svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.frames{position:fixed;top:calc(var(--top) + env(safe-area-inset-top));left:0;right:0;bottom:0}
.frames iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
.frames iframe[hidden]{display:none}
/* side menu */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.32);opacity:0;pointer-events:none;transition:opacity .25s;z-index:13}
.side{position:fixed;top:0;bottom:0;left:0;width:var(--side);max-width:84vw;background:linear-gradient(180deg,#FFFFFF,#F7F8FB);z-index:14;
  transform:translateX(-102%);transition:transform .28s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;
  padding:calc(10px + env(safe-area-inset-top)) 12px calc(14px + env(safe-area-inset-bottom));box-shadow:4px 0 24px rgba(30,43,74,.12);border-radius:0 22px 22px 0}
body.menu-open .side{transform:none}
body.menu-open .scrim{opacity:1;pointer-events:auto}
.side .iconbtn{margin:0 0 14px 2px}
.sec{display:flex;align-items:center;gap:8px;margin:6px 10px 8px;font-size:.82rem;font-weight:700;color:var(--brand)}
.sec i{width:12px;height:12px;border-radius:3px;background:var(--brand);display:block}
.item{position:relative;display:flex;align-items:center;gap:14px;width:100%;min-height:50px;border:0;background:none;border-radius:16px;padding:0 14px;margin-bottom:4px;
  font:inherit;font-size:1.02rem;color:#3A4256;cursor:pointer;text-align:left}
.item svg{width:24px;height:24px;flex:none;fill:none;stroke:var(--brand);stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.item:hover{background:rgba(215,38,61,.06)}
.item[aria-current="page"]{background:linear-gradient(90deg,var(--brand),var(--brand2));color:#fff;font-weight:700;box-shadow:0 6px 16px rgba(215,38,61,.28)}
.item[aria-current="page"] svg{stroke:#fff}
.item .cnt{position:absolute;left:30px;top:8px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:#fff;color:var(--brand);font-size:.7rem;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.18)}
.item:not([aria-current="page"]) .cnt{background:var(--brand);color:#fff}
.item .cnt[hidden]{display:none}
.item small{display:block;font-size:.75rem;font-weight:500;opacity:.75}
.hr{height:.5px;background:var(--sep);margin:12px 6px}
.me{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px 8px 0;border-top:.5px solid var(--sep)}
.me .av{width:38px;height:38px;border-radius:50%;background:#EEF1F6;color:var(--navy);font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.me div{flex:1;min-width:0}
.me b{display:block;font-size:.95rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me small{color:var(--label2);font-size:.78rem}
.out{border:0;background:none;color:var(--brand);font:inherit;font-weight:600;font-size:.88rem;cursor:pointer;padding:8px}
/* computer: the form gets the whole screen; the app menu sits behind a ☰ button (top-left) and slides in over the page */
.fab{display:none}
@media (min-width:900px){
  .topbar{display:none}
  .frames{top:0;left:0}
  .fab{display:flex;position:fixed;top:8px;left:10px;z-index:12;width:40px;height:40px;border:.5px solid var(--sep);border-radius:12px;background:rgba(255,255,255,.92);
    -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);box-shadow:0 2px 8px rgba(0,0,0,.08);align-items:center;justify-content:center;color:var(--navy);cursor:pointer}
  .fab:hover{background:#fff}
  .fab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
  body.at-home .fab,body.locked .fab,body.menu-open .fab{display:none}
  .sec{margin-top:18px}
}
body.locked .topbar,body.locked .side,body.locked .scrim{display:none}
/* Apple look (matches Night Shift design 1): grey sidebar, items in one inset group, the open app filled with its own colour */
.side{background:#F2F2F7;padding-left:12px;padding-right:12px}
.sec{margin:14px 12px 6px;font-size:.8rem;font-weight:400;color:var(--l2,#6E6E73)}
.sec i{display:none}
#goHome,.side [data-app]{background:#fff;border-radius:0;margin:0;min-height:54px;padding:0 12px;gap:12px;color:#000;font-size:.98rem}
#goHome{border-radius:12px;margin-top:4px}
.side [data-app="daily"]{border-radius:12px 12px 0 0}
.side [data-app="night"]{border-radius:0 0 12px 12px}
.side [data-app="night"]::before{content:"";position:absolute;top:0;left:52px;right:0;border-top:.5px solid #E5E5EA}
.item svg{width:30px;height:30px;padding:5px;border-radius:8px;background:#8E8E93;stroke:#fff;stroke-width:2.2}
#goHome svg{background:#8E8E93}
.side [data-app="daily"] svg{background:#FF3B30}
.side [data-app="night"] svg{background:#1C2B5A}
.item small{color:#6E6E73;opacity:1}
.item:hover{background:#F7F7FA}
.item[aria-current="page"]{background:#1C2B5A;color:#fff;font-weight:600;box-shadow:none}
.side [data-app="daily"][aria-current="page"]{background:#FF3B30}
.item[aria-current="page"] small{color:rgba(255,255,255,.8)}
.item[aria-current="page"] svg{background:rgba(255,255,255,.2)}
.side [data-app="night"][aria-current="page"]::before,.side [aria-current="page"]+[data-app="night"]::before{display:none}
.item .cnt{left:34px;top:6px;background:#FF3B30;color:#fff;box-shadow:0 0 0 2px #fff}
.item[aria-current="page"] .cnt{background:#fff;color:#1C2B5A;box-shadow:none}
.me{border-top:0;background:#fff;border-radius:12px;padding:10px}
.out{color:#FF3B30}
@media (min-width:900px){.side{border-right:.5px solid #D1D1D6}.sec{margin-top:16px}}

/* ===== Home (white): date strip + day summary for Daily and Night Shift ===== */
:root{--red:#FF3B30;--red-ink:#D70015;--navy:#1C2B5A;--navy-ink:#1C2B5A;--g1:#F2F2F7;--g2:#E5E5EA;--l2:#6E6E73;--l3:#8E8E93;--ok:#248A3D}
.home{position:fixed;inset:0;z-index:15;background:#FFFFFF;overflow:auto;-webkit-overflow-scrolling:touch;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Noto Sans Thai","Leelawadee UI",system-ui,sans-serif;color:#000}
.home[hidden]{display:none}
body.at-home .topbar,body.at-home .side,body.at-home .scrim,body.at-home .frames{display:none}
.hm-in{max-width:640px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 16px calc(32px + env(safe-area-inset-bottom))}
.hm-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px}
.hm-date{margin:0;color:var(--l3);font-size:.82rem;font-weight:600;text-transform:none}
.home h1{margin:2px 0 0;font-size:2.1rem;font-weight:700;letter-spacing:-.025em;line-height:1.1}
.hm-me{width:40px;height:40px;border-radius:50%;border:0;padding:0;background:var(--g1);cursor:pointer;flex:none}
.hm-av{display:flex;width:100%;height:100%;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;color:#3A3A3C}
/* week */
.hm-week{margin-bottom:16px}
.hm-weekbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.hm-weekbar b{font-size:1.05rem;font-weight:600}
.hm-nav{display:flex;gap:4px}
.hm-ib{position:relative;width:44px;height:44px;border:0;border-radius:12px;background:none;color:var(--red-ink);display:flex;align-items:center;justify-content:center;cursor:pointer}
.hm-ib:active{background:var(--g1)}
.hm-ib svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hm-cal input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.hm-days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.hm-day{border:0;background:none;border-radius:14px;padding:6px 0 8px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;font:inherit;color:#000;min-height:64px}
.hm-day .w{font-size:.7rem;color:var(--l3);font-weight:600}
.hm-day .d{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.05rem;font-weight:600}
.hm-day.today .d{color:var(--red-ink)}
.hm-day[aria-pressed="true"] .d{background:#000;color:#fff}
.hm-day[aria-pressed="true"].today .d{background:var(--red)}
.hm-day.future{opacity:.35}
.hm-dots{display:flex;gap:3px;height:6px}
.hm-dots i{width:6px;height:6px;border-radius:50%}
.hm-dots .dd{background:var(--red)}.hm-dots .dn{background:var(--navy)}.hm-dots .bad{background:#FF9500}
.hm-today{display:block;margin:6px auto 0;border:0;background:none;color:var(--red-ink);font:inherit;font-weight:600;font-size:.88rem;min-height:36px;cursor:pointer}
.hm-today[hidden]{display:none}
/* cards */
.hm-card{border:.5px solid var(--g2);border-radius:20px;padding:16px;margin-bottom:12px;background:#fff;box-shadow:0 8px 24px -14px rgba(0,0,0,.22)}
.hm-ch{display:flex;align-items:center;gap:12px}
.hm-ico{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none}
.hm-ico.red{background:var(--red)}.hm-ico.navy{background:var(--navy)}
.hm-ico svg{width:24px;height:24px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hm-ct{flex:1;min-width:0}.hm-ct b{display:block;font-size:1.05rem;font-weight:600}.hm-ct small{color:var(--l2);font-size:.82rem}
.hm-stat{text-align:right;font-size:1.35rem;font-weight:700;line-height:1.1;white-space:nowrap}
.hm-stat small{display:block;font-size:.72rem;font-weight:500;color:var(--l3)}
.hm-prog{height:6px;border-radius:3px;background:var(--g1);overflow:hidden;margin:14px 0 0}
.hm-prog i{display:block;height:100%;width:0;background:var(--navy);border-radius:3px;transition:width .3s ease}
.hm-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;min-height:8px}
.hm-chip{font-size:.78rem;font-weight:600;padding:5px 10px;border-radius:999px;background:var(--g1);color:#3A3A3C}
.hm-chip.ok{background:#E8F8EC;color:var(--ok)}.hm-chip.ng{background:#FFE5E3;color:var(--red-ink)}.hm-chip.st{background:#FFF1E0;color:#C93400}
.hm-empty{color:var(--l3);font-size:.85rem}
.hm-acts{display:flex;gap:8px;margin-top:14px}
.hm-b{flex:1;min-height:44px;border:0;border-radius:12px;font:inherit;font-size:.95rem;font-weight:600;cursor:pointer;text-align:center;display:flex;align-items:center;justify-content:center}
.hm-b:active{transform:scale(.98)}
.hm-b.red{background:var(--red);color:#fff}.hm-b.navy{background:var(--navy);color:#fff}.hm-b.alt{background:var(--g1);color:#000}
/* one style for both cards and one colour for the calendar (no red = Daily / blue = Night) */
.hm-b.pri{background:#1C1C1E;color:#fff}
.hm-ib{color:#1C1C1E}
.hm-day.today .d{color:#000;box-shadow:inset 0 0 0 1.5px #1C1C1E}
.hm-day[aria-pressed="true"] .d,.hm-day[aria-pressed="true"].today .d{background:#1C1C1E;color:#fff;box-shadow:none}
.hm-day.future[aria-pressed="true"]{opacity:1}
.hm-dots .dd,.hm-dots .dn{background:#8E8E93}
.hm-today{color:#1C1C1E}
.hm-date{color:#3A3A3C;font-size:.9rem}
.hm-foot{text-align:center;color:var(--l3);font-size:.75rem;margin:14px 0 0}
@media (prefers-reduced-motion:reduce){.hm-prog i{transition:none}}
/* login */
.login{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px 16px calc(24px + env(safe-area-inset-bottom));overflow:auto}
.login[hidden]{display:none}
.card{width:100%;max-width:380px;text-align:center}
.lg-logo{display:block;width:120px;height:120px;margin:0 auto 18px;border-radius:27px;box-shadow:0 10px 28px -8px rgba(11,42,107,.35),0 1px 2px rgba(11,42,107,.12)}
.icons span{width:68px;height:68px;border-radius:16px;box-shadow:0 4px 14px rgba(30,43,74,.16);display:flex;align-items:center;justify-content:center;overflow:hidden}
.icons img{width:100%;height:100%}
.icons .ns{background:#0d1117;color:#f5b301}
.icons .ns svg{width:36px;height:36px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
h1{font-size:1.6rem;font-weight:700;letter-spacing:-.02em;margin:0 0 26px}
.sub{margin:6px 0 26px;color:var(--label2);font-size:.92rem}
.grp{background:var(--card);border-radius:14px;overflow:hidden;text-align:left;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.f{display:flex;align-items:center;min-height:52px;padding:0 16px;gap:12px}
.f+.f{border-top:.5px solid var(--sep)}
.f span{width:72px;flex:none}
.f input{flex:1;min-width:0;border:0;background:none;font:inherit;font-size:1rem;color:var(--label);height:50px;outline:none}
.err{min-height:1.4em;margin:10px 4px 6px;color:var(--red);font-size:.9rem;text-align:left}
.btn{width:100%;min-height:52px;border:0;border-radius:14px;background:var(--tint);color:#fff;font:inherit;font-size:1.05rem;font-weight:700;cursor:pointer}
.btn:disabled{opacity:.6}
.note{margin:16px 4px 0;color:var(--label2);font-size:.8rem;line-height:1.5}
/* month calendar (centred card) */
.cal{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(0,0,0,.32);animation:alFade .2s ease}
.cal[hidden]{display:none}
.cal-box{width:100%;max-width:360px;background:#fff;border-radius:22px;padding:14px 14px 10px;box-shadow:0 24px 60px -16px rgba(0,0,0,.4);animation:alPop .25s cubic-bezier(.32,.72,0,1);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Noto Sans Thai","Leelawadee UI",system-ui,sans-serif;color:#000}
.cal-h{display:flex;align-items:center;justify-content:space-between;padding:0 2px 0 8px}
.cal-h b{font-size:1.05rem;font-weight:600}
.cal-h span{display:flex}
.cal-w,.cal-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));text-align:center}
.cal-w{margin:6px 0 2px;font-size:.72rem;font-weight:600;color:#8E8E93}
.cal-g button{position:relative;aspect-ratio:1;max-height:48px;border:0;background:none;font:inherit;font-size:1.02rem;font-weight:500;color:#000;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.cal-g button span{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.cal-g button.today span{box-shadow:inset 0 0 0 1.5px #1C1C1E;font-weight:700}
.cal-g button[aria-pressed="true"] span{background:#1C1C1E;color:#fff;font-weight:700;box-shadow:none}
.cal-g button.future{color:#C7C7CC}
.cal-g button.has::after{content:"";position:absolute;bottom:2px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:#8E8E93}
.cal-g button:hover span{background:#F2F2F7}
.cal-g button[aria-pressed="true"]:hover span{background:#1C1C1E}
.cal-f{display:flex;justify-content:space-between;margin-top:6px;border-top:.5px solid #E5E5EA;padding-top:6px}
.cal-f button{min-height:44px;padding:0 14px;border:0;background:none;font:inherit;font-size:1rem;font-weight:600;color:#1C1C1E;cursor:pointer;border-radius:10px}
.cal-f button:active{background:#F2F2F7}
/* admin view (design A): KPI row + people table + detail sheet */
.adm-pill{display:inline-block;margin-left:8px;vertical-align:middle;font-size:.7rem;font-weight:700;padding:3px 9px;border-radius:999px;background:#EEF1F6;color:#1C2B5A;letter-spacing:0}
.adm-kpi{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:4px 0 12px}
.adm-kpi div{border:.5px solid #E5E5EA;border-radius:14px;padding:10px 12px;background:#fff}
.adm-kpi small{display:block;color:#8E8E93;font-size:.72rem;font-weight:600}
.adm-kpi b{font-size:1.45rem;font-weight:700}.adm-kpi b i{font-style:normal;font-size:.75rem;font-weight:500;color:#8E8E93}
.adm-tbl{border:.5px solid #E5E5EA;border-radius:16px;overflow:hidden;background:#fff}
.adm-row{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,2fr) minmax(0,1.3fr) 54px 44px;align-items:center;gap:8px;padding:10px 12px;border-top:.5px solid #F0F0F2;width:100%;border-left:0;border-right:0;border-bottom:0;background:none;font:inherit;text-align:left;color:#000}
.adm-h{border-top:0;font-size:.72rem;font-weight:600;color:#8E8E93;padding-top:8px;padding-bottom:8px}
button.adm-row{cursor:pointer;min-height:56px}button.adm-row:hover{background:#F7F7FA}
.adm-row.off{opacity:.5}
.adm-who{display:flex;align-items:center;gap:8px;min-width:0}.adm-who b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.adm-av{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:.72rem;font-weight:700;background:#EEF1F6;color:#1C2B5A}
.adm-chips{display:flex;flex-wrap:wrap;gap:3px}
.adm-ns{font-size:.85rem}.adm-ns .hm-prog{margin:4px 0 0;height:4px}
.adm-t{font-size:.78rem;color:#8E8E93}.adm-go{color:#007AFF;font-weight:600;font-size:.85rem;text-align:right}
.adm-det{max-width:460px;max-height:86vh;overflow:auto}
.ad-sec{margin:12px 2px 6px;font-size:.78rem;font-weight:600;color:#8E8E93}
.ad-it{border:.5px solid #E5E5EA;border-radius:12px;padding:10px 12px;margin-bottom:6px}
.ad-it b{font-weight:600}.ad-it small{display:block;color:#6E6E73;font-size:.78rem;margin-top:2px}.ad-it .bad{color:#D70015}
.ad-open{display:block;width:100%;min-height:44px;margin-top:6px;border:0;border-radius:12px;background:#F2F2F7;font:inherit;font-weight:600;cursor:pointer}
@media (max-width:560px){.adm-kpi{grid-template-columns:repeat(2,minmax(0,1fr))}.adm-row{grid-template-columns:minmax(0,1fr) minmax(0,1.2fr) 44px}.adm-row>:nth-child(3),.adm-row>:nth-child(4){display:none}}
/* iOS-style alert (replaces the browser's own confirm box) */
.al{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(0,0,0,.32);animation:alFade .2s ease}
.al[hidden]{display:none}
.al-box{width:100%;max-width:290px;border-radius:14px;overflow:hidden;text-align:center;background:rgba(246,246,248,.94);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);box-shadow:0 20px 50px -12px rgba(0,0,0,.35);animation:alPop .25s cubic-bezier(.32,.72,0,1)}
.al-av{width:52px;height:52px;margin:20px auto 10px;border-radius:50%;background:#E5E5EA;color:#3A3A3C;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1.05rem}
.al-box h2{margin:0;padding:22px 16px;font-size:1.05rem;font-weight:600}
.al-box p{margin:0 16px 18px;font-size:.84rem;line-height:1.45;color:#3C3C43}
.al-acts{display:flex;border-top:.5px solid rgba(60,60,67,.29)}
.al-acts button{flex:1;min-height:46px;border:0;background:none;font:inherit;font-size:1.02rem;color:#007AFF;cursor:pointer}
.al-acts button+button{border-left:.5px solid rgba(60,60,67,.29)}
.al-acts button:active{background:rgba(0,0,0,.06)}
.al-acts .danger{color:#FF3B30;font-weight:600}
@keyframes alFade{from{opacity:0}}
@keyframes alPop{from{transform:scale(1.12);opacity:0}}
@media (prefers-reduced-motion:reduce){.al,.al-box{animation:none}}
</style>

    <div class="hm-week" role="group" aria-label="เลือกวันที่">
      <div class="hm-weekbar">
        <b id="hmMonth"></b>
        <span class="hm-nav">
          <button type="button" class="hm-ib" id="hmPrev" aria-label="สัปดาห์ก่อน"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
          <button type="button" class="hm-ib" id="hmNext" aria-label="สัปดาห์ถัดไป"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
          <button type="button" class="hm-ib" id="hmCalBtn" aria-label="เลือกจากปฏิทิน" aria-haspopup="dialog"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M8 3v4M16 3v4"/></svg></button>
        </span>
      </div>
      <div class="hm-days" id="hmDays"></div>
      <button type="button" class="hm-today" id="hmGoToday" hidden>กลับไปวันนี้</button>
    </div>

<script src="tasks.js"></script>
<script>
/* where the two apps and their Apps Script back ends are */
// ?v= makes the browser load the new file after each upload (bump it whenever index.html / daily_inspection_mobile.html change)
const V = '20261124n';
const APPS = { daily: 'daily_inspection_mobile.html?v=' + V, night: 'index.html?v=' + V };
// both apps now use the same Apps Script (Daily's): one account list, one Google Sheet
const DAILY_API = 'https://script.google.com/macros/s/AKfycbxuM2GmQGbDG7tLM0uQiqsEvHcqeEQ8M93e6qsIn06fAmSB8MUMGz7mh-nRX8ZOUc6H9Q/exec';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const ls = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} },
  json(k) { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch { return null; } },
};
const post = async (url, body) => {
  const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
  return r.json();
};

/* signed in = at least one of the two apps has a session */
const dailySession = () => { const s = ls.json('di_user'); return s && s.token ? s : null; };
const nightSession = () => { const u = (ls.json('nsp') || {}).user; return u && u.token ? u : null; };

let current = ls.get('shell_tab') === 'night' ? 'night' : 'daily';
const frames = {};
function frame(app) {
  if (!frames[app]) {
    const f = document.createElement('iframe');
    f.title = app === 'daily' ? 'Daily Inspection' : 'Night Shift Plan';
    f.src = APPS[app];
    f.hidden = true;
    f.addEventListener('load', () => { f.dataset.ready = '1'; });
    $('frames').appendChild(f);
    frames[app] = f;
  }
  return frames[app];
}
const TITLES = { daily: 'Daily Inspection', night: 'Night Shift' };
/* opened as a local file / preview snapshot: the two apps can't load inside — say how to open it instead of a blank page */
const LOCAL = !/^https?:$/.test(location.protocol);
function localNotice() {
  $('frames').innerHTML = `<div style="max-width:420px;margin:15vh auto 0;padding:24px;text-align:center;color:#3A4256;line-height:1.6">
    <div style="font-size:2.2rem">📱</div><h2 style="margin:8px 0;font-size:1.2rem">เปิดจากไฟล์ในเครื่องไม่ได้</h2>
    <p style="margin:0 0 16px;color:var(--label2)">หน้านี้ต้องเปิดผ่านเว็บ ฟอร์ม Daily และ Night Shift ถึงจะขึ้น อัปโหลดขึ้น GitHub แล้วเปิดลิงก์นี้</p>
    <a href="https://wongnantananthaya-ai.github.io/Daily/app.html" style="color:var(--tint);font-weight:600;word-break:break-all">wongnantananthaya-ai.github.io/Daily/app.html</a></div>`;
}
/* ---------- home: pick a day → see what was filled (Daily + Night Shift) → open either app at that day ---------- */
const HM = { sel: '', daily: null, night: {}, loadingNight: '' };
const TH_W = ['อา', 'จ', 'อ', 'พ', 'พฤ', 'ศ', 'ส'], TH_WL = ['อาทิตย์', 'จันทร์', 'อังคาร', 'พุธ', 'พฤหัสบดี', 'ศุกร์', 'เสาร์'];
const TH_M = ['มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน', 'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'];
const TH_MS = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
const ymd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const pd = s => new Date(+s.slice(0, 4), +s.slice(5, 7) - 1, +s.slice(8, 10));
const addDays = (s, n) => { const d = pd(s); d.setDate(d.getDate() + n); return ymd(d); };
const todayStr = () => ymd(new Date());
// Night shift runs 20:00 → 08:00 next morning and is named by the evening it starts.
// Before 08:00 "today" is still last night's shift, so the Night Shift card shows that night.
const nightOf = d => (d === todayStr() && new Date().getHours() < 8) ? addDays(d, -1) : d;
const thShort = s => { const d = pd(s); return `${d.getDate()} ${TH_MS[d.getMonth()]} ${d.getFullYear() + 543}`; };
// nights that this device already has (Night Shift keeps a local copy) — for the dots on the week strip
const localNights = () => { const s = new Set(); Object.keys(((ls.json('nsp') || {}).rec) || {}).forEach(k => { const d = k.split('|')[1]; if (d) s.add(d); }); return s; };

function hmRender() {
  const sel = HM.sel, t = todayStr(), mon = addDays(sel, -((pd(sel).getDay() + 6) % 7));
  const sd = pd(sel);   // the line above the title shows the day picked on the calendar
  $('hmToday').textContent = `วัน${TH_WL[sd.getDay()]}ที่ ${sd.getDate()} ${TH_M[sd.getMonth()]} ${sd.getFullYear() + 543}${sel === t ? ' · วันนี้' : ''}`;
  $('hmMonth').textContent = `${TH_M[pd(sel).getMonth()]} ${pd(sel).getFullYear() + 543}`;
  const dDays = new Set((HM.daily || []).map(r => r.date)), nDays = localNights();
  Object.entries(HM.night).forEach(([d, st]) => { if (st && Object.keys(st).length) nDays.add(d); });
  $('hmDays').innerHTML = Array.from({ length: 7 }, (_, i) => {
    const d = addDays(mon, i), dt = pd(d);
    return `<button type="button" class="hm-day ${d === t ? 'today' : ''} ${d > t ? 'future' : ''}" data-day="${d}" aria-pressed="${d === sel}" aria-label="${TH_WL[dt.getDay()]} ${dt.getDate()} ${TH_M[dt.getMonth()]}">
      <span class="w">${TH_W[dt.getDay()]}</span><span class="d">${dt.getDate()}</span>
      <span class="hm-dots">${dDays.has(d) || nDays.has(d) ? '<i class="dd"></i>' : ''}</span></button>`;   // one dot = something was filled that day
  }).join('');
  $('hmGoToday').hidden = sel === t;
  if (!$('cal').hidden) calRender();

  // ---- Daily of the selected day ----
  $('hmDSub').textContent = 'วันที่ ' + thShort(sel);
  if (!HM.daily) { $('hmDStat').innerHTML = ''; $('hmDChips').innerHTML = '<span class="hm-empty">กำลังโหลด…</span>'; }
  else {
    const recs = HM.daily.filter(r => r.date === sel).sort((a, b) => (a.type + a.no).localeCompare(b.type + b.no));
    const bad = recs.filter(r => r.result === 'ผิดปกติ').length;
    $('hmDStat').innerHTML = `${recs.length}<small>เครื่อง${bad ? ` · ผิดปกติ ${bad}` : ''}</small>`;
    $('hmDStat').style.color = bad ? 'var(--red-ink)' : '#000';
    $('hmDChips').innerHTML = recs.length
      ? recs.map(r => `<span class="hm-chip ${r.result === 'ผิดปกติ' ? 'ng' : r.result === 'Stop' ? 'st' : 'ok'}">${esc(r.type)} ${esc(r.no)} ${r.result === 'ผิดปกติ' ? '!' : r.result === 'Stop' ? 'Stop' : '✓'}</span>`).join('')
      : `<span class="hm-empty">${sel > t ? 'ยังไม่ถึงวันนี้' : 'ยังไม่มีการตรวจวันนี้'}</span>`;
  }

  // ---- Night Shift of the selected night ----
  const ns = nightOf(sel), nsD = pd(ns), nsN = pd(addDays(ns, 1));
  $('hmNSub').textContent = `${nsD.getDate()} ${TH_MS[nsD.getMonth()]} 20:00 – ${nsN.getDate()} ${TH_MS[nsN.getMonth()]} 08:00`;
  const st = HM.night[ns];
  if (st === undefined) { $('hmNStat').innerHTML = ''; $('hmNBar').style.width = '0'; $('hmNChips').innerHTML = '<span class="hm-empty">กำลังโหลด…</span>'; }
  else {
    const tasks = st.tasks || {}, list = (typeof TASKS !== 'undefined' && TASKS[pd(sel).getDay()]) || [];   // TASKS comes from tasks.js
    const done = Object.keys(tasks).filter(k => /^t\d+$/.test(k) && tasks[k].v === '✓').length, total = list.length || done;
    let ng = 0;
    const forms = [['sub1', 'Sub 1'], ['sub2', 'Sub 2'], ['adrain', 'Auto drain'], ['light', 'Light']].map(([k, n]) => {
      const vals = Object.values(st[k] || {}).map(x => x.v).filter(v => v !== '');
      const bad = vals.filter(v => v === 'NG' || v === 'ผิดปกติ').length; ng += bad;
      return `<span class="hm-chip ${bad ? 'ng' : vals.length ? 'ok' : ''}">${n} ${bad ? 'NG ' + bad : vals.length ? '✓' : '–'}</span>`;
    });
    $('hmNStat').innerHTML = total ? `${done}/${total}<small>งาน${ng ? ` · NG ${ng}` : ''}</small>` : `–<small>งาน</small>`;
    $('hmNStat').style.color = ng ? 'var(--red-ink)' : '#000';
    $('hmNBar').style.width = total ? Math.round(done / total * 100) + '%' : '0';
    $('hmNChips').innerHTML = Object.keys(st).length ? forms.join('') : `<span class="hm-empty">${ns > nightOf(t) ? 'ยังไม่ถึงคืนนี้' : 'ยังไม่มีการกรอกคืนนี้'}</span>`;
  }
  // admin: the two app cards (with "กรอก") make way for the who-filled-what view
  const adm = isAdmin();
  document.querySelectorAll('.hm-card').forEach(c => { c.hidden = adm; });
  $('admBox').hidden = !adm;
  $('hmTitle').textContent = adm ? 'ผู้ดูแล' : 'Inspection';
  if (adm) admRender();
  const d = dailySession() || nightSession();
  $('hmFoot').textContent = d ? `${d.name}${d.admin ? ' · admin (เห็นข้อมูลทุกคน · แก้ได้เฉพาะที่กรอกแล้ว)' : ' · เห็นข้อมูลที่ตัวเองกรอก'}` : '';
}
/* ---------- admin: who filled what (view only) ---------- */
const isAdmin = () => !!((dailySession() || nightSession() || {}).admin);
const DAILY_N = { ACP: 'Air Compressor', AD: 'Air Dryer', CT: 'Cooling Tower' };
async function hmLoadUsers() {
  const s = dailySession() || nightSession();
  try { const j = await post(DAILY_API, { action: 'users', token: s.token }); if (j && j.ok) HM.users = j.users || []; } catch {}
  if (!$('home').hidden) hmRender();
}
// everything one person did on the chosen day / night
function admWork(p) {
  const sel = HM.sel, ns = nightOf(sel), st = HM.night[ns] || {};
  const mine = r => r.user ? r.user === p.user : r.inspector === p.name;
  const daily = (HM.daily || []).filter(r => r.date === sel && mine(r)).sort((a, b) => (a.type + a.no).localeCompare(b.type + b.no));
  let tasks = 0, last = '';
  const forms = {};
  Object.entries(st).forEach(([form, fs]) => Object.entries(fs).forEach(([id, x]) => {
    if (x.by !== p.name || x.v === '') return;
    if (form === 'tasks') { if (/^t\d+$/.test(id) && x.v === '✓') tasks++; }
    else forms[form] = (forms[form] || 0) + 1;
    if (x.at && x.at > last) last = x.at;
  }));
  daily.forEach(r => { const m = /(\d{2})\/(\d{2})\/(\d{4}) (\d{2}:\d{2})/.exec(r.saved); if (m) { const t = `${m[3]}-${m[2]}-${m[1]} ${m[4]}`; if (t > last) last = t; } });
  return { daily, tasks, forms, last, any: daily.length || tasks || Object.keys(forms).length };
}
const admChip = r => `<span class="hm-chip ${r.result === 'ผิดปกติ' ? 'ng' : r.result === 'Stop' ? 'st' : 'ok'}">${esc(r.type)} ${esc(r.no)} ${r.result === 'ผิดปกติ' ? '!' : r.result === 'Stop' ? 'Stop' : '✓'}</span>`;
function admRender() {
  const sel = HM.sel, ns = nightOf(sel), st = HM.night[ns], total = (typeof TASKS !== 'undefined' && TASKS[pd(ns).getDay()] || []).length;
  // people = active non-admin users, plus anyone who filled but isn't in the list
  const people = (HM.users || []).filter(u => u.active && !u.admin).map(u => ({ user: u.user, name: u.name }));
  const known = new Set(people.map(p => p.user));
  (HM.daily || []).filter(r => r.date === sel && r.user && !known.has(r.user)).forEach(r => { known.add(r.user); people.push({ user: r.user, name: r.inspector || r.user }); });
  const rows = people.map(p => ({ p, w: admWork(p) })).sort((a, b) => (b.w.any ? 1 : 0) - (a.w.any ? 1 : 0) || (b.w.last > a.w.last ? 1 : -1));
  const dayRecs = (HM.daily || []).filter(r => r.date === sel);
  const done = st ? Object.keys(st.tasks || {}).filter(k => /^t\d+$/.test(k) && st.tasks[k].v === '✓').length : 0;
  const bad = dayRecs.filter(r => r.result === 'ผิดปกติ').length;
  $('admKpi').innerHTML = `<div><small>ผู้ตรวจที่กรอก</small><b>${rows.filter(x => x.w.any).length}<i> / ${people.length} คน</i></b></div>
    <div><small>Daily ตรวจแล้ว</small><b>${dayRecs.length}<i> เครื่อง</i></b></div>
    <div><small>ผิดปกติ</small><b style="color:${bad ? 'var(--red-ink)' : '#000'}">${bad}</b></div>
    <div><small>กะดึก</small><b>${st ? done : '–'}<i> / ${total || '–'} งาน</i></b></div>`;
  $('admRows').innerHTML = !HM.users ? '<div class="adm-row"><span class="hm-empty">กำลังโหลด…</span></div>'
    : !rows.length ? '<div class="adm-row"><span class="hm-empty">ยังไม่มีผู้ตรวจในแท็บผู้ใช้</span></div>'
    : rows.map(({ p, w }) => {
      const ini = Array.from(p.name).filter(ch => /[ก-ฮA-Za-z0-9]/.test(ch)).slice(0, 2).join('') || '?';
      const nf = Object.values(w.forms).reduce((a, b) => a + b, 0);
      return `<button type="button" class="adm-row ${w.any ? '' : 'off'}" data-adm="${esc(p.user)}" ${w.any ? '' : 'disabled'}>
        <span class="adm-who"><span class="adm-av">${esc(ini)}</span><b>${esc(p.name)}</b></span>
        <span class="adm-chips">${w.daily.length ? w.daily.map(admChip).join('') : `<span class="hm-empty">${w.any ? '–' : 'ยังไม่กรอก'}</span>`}</span>
        <span class="adm-ns">${w.tasks || nf ? `${w.tasks}${total ? '/' + total : ''} งาน${nf ? ` · ${nf} ช่อง` : ''}<div class="hm-prog"><i style="width:${total ? Math.round(w.tasks / total * 100) : 0}%"></i></div>` : '<span class="hm-empty">–</span>'}</span>
        <span class="adm-t">${w.last ? w.last.slice(11) : '–'}</span><span class="adm-go">${w.any ? 'ดู ›' : ''}</span></button>`;
    }).join('');
}
// detail sheet for one person
const FORM_N = { sub1: 'Sub 1', sub2: 'Sub 2', adrain: 'Auto drain', light: 'Light' };
function admOpen(user) {
  const p = (HM.users || []).find(u => u.user === user) || { user, name: ((HM.daily || []).find(r => r.user === user) || {}).inspector || user };
  const w = admWork(p), sel = HM.sel, ns = nightOf(sel), nd = pd(ns), total = (typeof TASKS !== 'undefined' && TASKS[nd.getDay()] || []).length;
  $('adT').textContent = `${p.name} · ${thShort(sel)}`;
  let h = `<div class="ad-sec">Daily Inspection · ${w.daily.length} เครื่อง</div>`;
  h += w.daily.length ? w.daily.map(r => `<div class="ad-it"><b>${esc(DAILY_N[r.type] || r.type)} NO. ${esc(r.no)}</b> ${admChip(r)}
      <small>${r.status && r.status !== 'Running' ? esc(r.status) + ' · ' : ''}บันทึก ${esc(r.saved || '–')}</small>
      ${r.issues.length ? `<small class="bad">ผิดปกติ: ${r.issues.map(esc).join(' · ')}</small>` : ''}</div>`).join('')
    + `<button type="button" class="ad-open" data-adopen="daily">เปิดดู / แก้ใน Daily</button>`
    : '<div class="ad-it"><small>ไม่ได้ตรวจ Daily วันนี้</small></div>';
  h += `<div class="ad-sec">Night Shift · คืน ${nd.getDate()} ${TH_MS[nd.getMonth()]} 20:00–08:00</div>`;
  const nf = Object.entries(w.forms);
  h += w.tasks || nf.length ? `<div class="ad-it"><b>งานคืนนี้ ${w.tasks}${total ? '/' + total : ''}</b>
      ${nf.length ? `<small>เช็คชีต: ${nf.map(([k, n]) => `${FORM_N[k] || k} ${n} ช่อง`).join(' · ')}</small>` : ''}
      <small>ล่าสุด ${esc(w.last ? w.last.slice(11) : '–')}</small></div>
      <button type="button" class="ad-open" data-adopen="night">เปิดดู / แก้กะดึกคืนนี้</button>`
    : '<div class="ad-it"><small>ไม่ได้กรอกกะดึกคืนนี้</small></div>';
  $('adBody').innerHTML = h; $('admDet').hidden = false;
}
$('admRows').addEventListener('click', e => { const b = e.target.closest('[data-adm]'); if (b) admOpen(b.dataset.adm); });
$('adX').addEventListener('click', () => { $('admDet').hidden = true; });
$('admDet').addEventListener('click', e => {
  if (e.target === $('admDet')) { $('admDet').hidden = true; return; }
  const o = e.target.closest('[data-adopen]'); if (!o) return;
  const app = o.dataset.adopen, d = app === 'night' ? nightOf(HM.sel) : HM.sel;
  $('admDet').hidden = true; leaveHome(); show(app);
  callApp(app, w => w.shellOpenDate && w.shellOpenDate(d, app === 'daily'));
});
addEventListener('keydown', e => { if (e.key === 'Escape' && !$('admDet').hidden) $('admDet').hidden = true; });

async function hmLoadDaily() {
  const s = dailySession();
  try {
    const j = s ? await post(DAILY_API, { action: 'list', token: s.token }) : null;
    if (j && j.ok) HM.daily = (j.records || []).map(r => ({ date: String(r.date), type: r.type, no: String(r.no), result: r.result || '',
      inspector: String(r.inspector || ''), user: String(r.user || '').toLowerCase(), saved: String(r.saved || ''), status: String(r.status || ''),
      issues: (r.issueList || []).map(i => i.label) }));
    else if (j && j.auth === false) return signOutAll();
  } catch {}
  if (!HM.daily) HM.daily = (ls.json('daily_inspection_records_v1') || []).map(r => ({ date: r.date, type: r.type, no: String(r.machineNo || ''), result: '' }));
  if (!$('home').hidden) hmRender();
}
async function hmLoadNight(date) {
  const s = dailySession() || nightSession();
  HM.loadingNight = date;
  try {
    const j = s ? await post(DAILY_API, { action: 'get', date, token: s.token }) : null;
    if (j && j.ok) HM.night[date] = j.state || {};
    else if (j && j.auth === false) return signOutAll();
  } catch {}
  if (HM.night[date] === undefined) {   // offline: use this device's copy
    const rec = ((ls.json('nsp') || {}).rec) || {}, st = {};
    Object.entries(rec).forEach(([k, v]) => { const [f, d] = k.split('|'); if (d === date) st[f] = Object.fromEntries(Object.entries(v).filter(([id]) => !id.startsWith('_')).map(([id, x]) => [id, { v: x === true ? '✓' : String(x ?? '') }])); });
    HM.night[date] = st;
  }
  if (!$('home').hidden && nightOf(HM.sel) === date) hmRender();
}
function hmSelect(d) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(d || '')) return;
  HM.sel = d; hmRender();
  if (HM.night[nightOf(d)] === undefined) hmLoadNight(nightOf(d));
}
function showHome() {
  document.body.classList.add('at-home'); $('home').hidden = false; closeMenu();
  document.title = 'Inspection';
  if (!HM.sel) HM.sel = todayStr();
  // show the last numbers straight away, then refresh them in the background (no "กำลังโหลด…" on every visit)
  refreshMe(); hmRender(); hmLoadDaily(); hmLoadNight(nightOf(HM.sel));
  if (isAdmin()) hmLoadUsers();
  preloadApps();
}
// load both apps hidden in the background once the home page has its data, so opening Daily / Night Shift is instant
let preloaded = false;
function preloadApps() {
  if (preloaded || LOCAL) return; preloaded = true;
  const go = () => { frame('daily'); frame('night'); };
  setTimeout(() => (window.requestIdleCallback ? requestIdleCallback(go, { timeout: 3000 }) : go()), 2500);
}
function leaveHome() { document.body.classList.remove('at-home'); $('home').hidden = true; }
// run something inside an app once it has loaded (same-origin iframe)
function callApp(app, fn) {
  const f = frame(app), run = () => { try { fn(f.contentWindow); } catch (e) {} };
  if (f.dataset.ready) run(); else f.addEventListener('load', () => setTimeout(run, 400), { once: true });
}
$('hmDays').addEventListener('click', e => { const b = e.target.closest('[data-day]'); if (b) hmSelect(b.dataset.day); });
$('hmPrev').addEventListener('click', () => hmSelect(addDays(HM.sel, -7)));
$('hmNext').addEventListener('click', () => hmSelect(addDays(HM.sel, 7)));
/* month calendar */
const CAL = { m: '' };   // 'yyyy-mm' shown
function calRender() {
  const [y, m] = CAL.m.split('-').map(Number), first = new Date(y, m - 1, 1), days = new Date(y, m, 0).getDate(), t = todayStr();
  const has = new Set((HM.daily || []).map(r => r.date)); localNights().forEach(d => has.add(d));
  Object.entries(HM.night).forEach(([d, st]) => { if (st && Object.keys(st).length) has.add(d); });
  $('calT').textContent = `${TH_M[m - 1]} ${y + 543}`;
  let h = '<span></span>'.repeat(first.getDay());
  for (let i = 1; i <= days; i++) {
    const d = `${CAL.m}-${String(i).padStart(2, '0')}`;
    h += `<button type="button" data-cd="${d}" class="${d === t ? 'today' : ''} ${d > t ? 'future' : ''} ${has.has(d) ? 'has' : ''}" aria-pressed="${d === HM.sel}" aria-label="${i} ${TH_M[m - 1]}${has.has(d) ? ' มีข้อมูล' : ''}"><span>${i}</span></button>`;
  }
  $('calG').innerHTML = h;
}
const calShift = n => { const [y, m] = CAL.m.split('-').map(Number), d = new Date(y, m - 1 + n, 1); CAL.m = ymd(d).slice(0, 7); calRender(); };
function calOpen() { CAL.m = HM.sel.slice(0, 7); calRender(); $('cal').hidden = false; setTimeout(() => $('calG').querySelector('[aria-pressed="true"]')?.focus(), 30); }
const calClose = () => { $('cal').hidden = true; $('hmCalBtn').focus(); };
$('hmCalBtn').addEventListener('click', calOpen);
$('calPrev').addEventListener('click', () => calShift(-1));
$('calNext').addEventListener('click', () => calShift(1));
$('calClose').addEventListener('click', calClose);
$('calToday').addEventListener('click', () => { hmSelect(todayStr()); calClose(); });
$('calG').addEventListener('click', e => { const b = e.target.closest('[data-cd]'); if (b) { hmSelect(b.dataset.cd); calClose(); } });
$('cal').addEventListener('click', e => { if (e.target === $('cal')) calClose(); });
addEventListener('keydown', e => { if (e.key === 'Escape' && !$('cal').hidden) calClose(); });
$('hmGoToday').addEventListener('click', () => hmSelect(todayStr()));
document.querySelectorAll('[data-open]').forEach(b => b.addEventListener('click', () => {
  const app = b.dataset.open, view = !!b.dataset.view, d = app === 'night' ? nightOf(HM.sel) : HM.sel;
  leaveHome(); show(app);
  callApp(app, w => w.shellOpenDate && w.shellOpenDate(d, view));   // the app opens at the chosen day
}));
$('goHome').addEventListener('click', showHome);
// logout asks with an iOS-style alert instead of the browser's confirm box (which shows the web address and OK/Cancel)
function askLogout() {
  $('alOut').hidden = false; setTimeout(() => $('alNo').focus(), 30);
}
const closeAl = () => { $('alOut').hidden = true; };
$('alNo').addEventListener('click', closeAl);
$('alYes').addEventListener('click', () => { closeAl(); signOutAll(); });
$('alOut').addEventListener('click', e => { if (e.target === $('alOut')) closeAl(); });
addEventListener('keydown', e => { if (e.key === 'Escape' && !$('alOut').hidden) closeAl(); });
$('hmMe').addEventListener('click', askLogout);
function show(app) {
  current = app; ls.set('shell_tab', app);
  if (LOCAL) { document.querySelectorAll('.side [data-app]').forEach(b => b.dataset.app === app ? b.setAttribute('aria-current', 'page') : b.removeAttribute('aria-current')); $('appTitle').textContent = TITLES[app]; closeMenu(); return localNotice(); }
  frame(app).hidden = false;
  Object.entries(frames).forEach(([k, f]) => { if (k !== app) f.hidden = true; });
  document.querySelectorAll('.side [data-app]').forEach(b => b.dataset.app === app ? b.setAttribute('aria-current', 'page') : b.removeAttribute('aria-current'));
  $('appTitle').textContent = TITLES[app]; document.title = TITLES[app];
  closeMenu();
}
document.querySelectorAll('.side [data-app]').forEach(b => b.addEventListener('click', () => show(b.dataset.app)));

/* side menu (phone: slides in; computer: always shown) */
function openMenu() { document.body.classList.add('menu-open'); $('menuOpen').setAttribute('aria-expanded', 'true'); setTimeout(() => document.querySelector('.side [aria-current]')?.focus(), 50); }
function closeMenu() { document.body.classList.remove('menu-open'); $('menuOpen').setAttribute('aria-expanded', 'false'); }
$('menuOpen').addEventListener('click', openMenu);
$('menuFab').addEventListener('click', openMenu);
$('menuClose').addEventListener('click', closeMenu);
$('scrim').addEventListener('click', closeMenu);
addEventListener('keydown', e => { if (e.key === 'Escape') closeMenu(); });

/* who is signed in + items still waiting to be sent, per app */
function refreshMe() {
  const d = dailySession(), n = nightSession(), name = (d && d.name) || (n && n.name) || '-';
  $('meName').textContent = name;
  $('meAv').textContent = Array.from(name).filter(ch => /[ก-ฮA-Za-z0-9]/.test(ch)).slice(0, 2).join('') || '?';
  $('meRole').textContent = d && d.admin ? 'admin' : 'ผู้ตรวจ';
  const dq = (ls.json('di_sync_queue') || []).length, nq = ((ls.json('nsp') || {}).q || []).length;
  $('cntDaily').hidden = !dq; $('cntDaily').textContent = dq;
  $('cntNight').hidden = !nq; $('cntNight').textContent = nq;
  $('hmAv').textContent = $('meAv').textContent;
}
setInterval(refreshMe, 3000);
$('logout').addEventListener('click', askLogout);

function openApps() {
  $('login').hidden = true; document.body.classList.remove('locked');
  Object.values(frames).forEach(f => f.remove()); for (const k in frames) delete frames[k];   // fresh load with the new sessions
  preloaded = false; HM.daily = null; HM.night = {}; HM.users = null;   // another account may have signed in: don't show the previous one's numbers
  refreshMe(); showHome();   // after sign-in: choose Daily or Night Shift
}
function signOutAll() {
  document.body.classList.add('locked'); closeMenu(); leaveHome();
  const d = dailySession(); if (d) post(DAILY_API, { action: 'logout', token: d.token }).catch(() => {});
  ls.set('di_user', null);
  const ns = ls.json('nsp'); if (ns && ns.user) { delete ns.user; ls.set('nsp', JSON.stringify(ns)); }
  Object.values(frames).forEach(f => f.remove()); for (const k in frames) delete frames[k];
  $('pass').value = ''; $('err').textContent = ''; $('login').hidden = false; setTimeout(() => $('user').focus(), 60);
}
// either app asks to log out → log out of both
addEventListener('message', e => { if (e.origin === location.origin && e.data && e.data.type === 'shell-logout') signOutAll(); });

$('user').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); $('pass').focus(); } });
['user', 'pass'].forEach(id => $(id).addEventListener('input', () => { $('err').textContent = ''; }));
$('form').addEventListener('submit', async e => {
  e.preventDefault();
  const user = $('user').value.trim(), pass = $('pass').value;
  if (!user || !pass) { $('err').textContent = 'กรอกชื่อผู้ใช้และรหัสผ่าน'; (!user ? $('user') : $('pass')).focus(); return; }
  $('go').disabled = true; $('go').textContent = 'กำลังเข้าสู่ระบบ…';
  // one sign-in, one token: shared by Daily ("di_user") and Night Shift ("nsp".user)
  let j;
  try { j = await post(DAILY_API, { action: 'login', user: user.toLowerCase(), pass }); }
  catch { j = { ok: false, error: 'เชื่อมต่อไม่ได้ ตรวจอินเทอร์เน็ตแล้วลองใหม่' }; }
  $('go').disabled = false; $('go').textContent = 'เข้าสู่ระบบ';
  if (!j.ok) { $('err').textContent = j.error || 'เข้าสู่ระบบไม่ได้'; $('pass').value = ''; $('pass').focus(); return; }
  if (ls.get('di_last_user') !== j.user) { ls.set('daily_inspection_records_v1', null); ls.set('di_sync_queue', null); }
  ls.set('di_last_user', j.user);
  const s = { user: j.user, name: j.name, token: j.token, admin: !!j.admin };
  ls.set('di_user', JSON.stringify(s));
  const ns = ls.json('nsp') || {}; ns.user = s; ls.set('nsp', JSON.stringify(ns));
  openApps();
});

if (dailySession() || nightSession()) openApps();
else { document.body.classList.add('locked'); setTimeout(() => $('user').focus(), 60); }
</script>
</body>
</html>
