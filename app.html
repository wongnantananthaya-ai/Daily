<style>
:root{
  --bg:#F2F2F7;--card:#fff;--bar:rgba(249,249,249,.94);
  --g1:#F2F2F7;--g2:#E5E5EA;
  --label:#000;--label2:rgba(60,60,67,.62);--l2:#6E6E73;--l3:#8E8E93;
  --sep:rgba(60,60,67,.29);
  --tint:#007AFF;--red:#FF3B30;--red-ink:#D70015;--navy:#1C2B5A;--ok:#248A3D;
  --side:256px;--top:52px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{
  margin:0;height:100%;background:var(--bg);color:var(--label);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Leelawadee UI","Noto Sans Thai",sans-serif;
  -webkit-font-smoothing:antialiased;
}
h1{font-size:1.6rem;font-weight:700;letter-spacing:-.02em;margin:0 0 26px}

/* Top bar & app frames */
.topbar{
  position:fixed;top:0;left:0;right:0;
  height:calc(var(--top) + env(safe-area-inset-top));padding-top:env(safe-area-inset-top);
  display:flex;align-items:center;gap:6px;padding-left:6px;
  background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  border-bottom:.5px solid var(--sep);z-index:12;
}
.topbar b{font-size:1rem;font-weight:600}
.iconbtn{
  width:44px;height:44px;border:0;background:none;border-radius:12px;
  display:flex;align-items:center;justify-content:center;color:var(--navy);cursor:pointer;
}
.iconbtn:active{background:rgba(0,0,0,.06)}
.iconbtn svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.frames{position:fixed;top:calc(var(--top) + env(safe-area-inset-top));left:0;right:0;bottom:0}
.frames iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
.frames iframe[hidden]{display:none}
.dsk-home,.dsk-tabs,.dsk-right{display:none}

/* Navigation drawer */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.32);opacity:0;pointer-events:none;transition:opacity .25s;z-index:13}
.side{
  position:fixed;top:0;bottom:0;left:0;width:var(--side);max-width:84vw;
  background:var(--bg);z-index:14;
  transform:translateX(-102%);transition:transform .28s cubic-bezier(.2,.8,.2,1);
  display:flex;flex-direction:column;
  padding:calc(10px + env(safe-area-inset-top)) 12px calc(14px + env(safe-area-inset-bottom));
  box-shadow:4px 0 24px rgba(30,43,74,.12);border-radius:0 22px 22px 0;
}
body.menu-open .side{transform:none}
body.menu-open .scrim{opacity:1;pointer-events:auto}
.side .iconbtn{margin:0 0 14px 2px}
.sec{margin:14px 12px 6px;font-size:.8rem;font-weight:400;color:var(--l2)}
.item{
  position:relative;display:flex;align-items:center;gap:12px;width:100%;min-height:54px;
  border:0;background:#fff;padding:0 12px;margin:0;
  font:inherit;font-size:.98rem;color:#000;cursor:pointer;text-align:left;
}
#goHome{border-radius:12px;margin-top:4px}
.side [data-app="daily"]{border-radius:12px 12px 0 0}
.side [data-app="night"]{border-radius:0 0 12px 12px}
.side [data-app="night"]::before{content:"";position:absolute;top:0;left:52px;right:0;border-top:.5px solid var(--g2)}
.item svg{
  width:30px;height:30px;padding:5px;border-radius:8px;flex:none;
  fill:none;background:var(--l3);stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;
}
.side [data-app="daily"] svg{background:var(--red)}
.side [data-app="night"] svg{background:var(--navy)}
.item small{display:block;font-size:.75rem;font-weight:500;color:var(--l2)}
.item:hover{background:#F7F7FA}
.item[aria-current="page"]{background:var(--navy);color:#fff;font-weight:600}
.side [data-app="daily"][aria-current="page"]{background:var(--red)}
.item[aria-current="page"] small{color:rgba(255,255,255,.8)}
.item[aria-current="page"] svg{background:rgba(255,255,255,.2)}
.side [data-app="night"][aria-current="page"]::before,
.side [aria-current="page"]+[data-app="night"]::before{display:none}
.item .cnt{
  position:absolute;left:34px;top:6px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;
  background:var(--red);color:#fff;font-size:.7rem;font-weight:800;
  display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px #fff;
}
.item[aria-current="page"] .cnt{background:#fff;color:var(--navy);box-shadow:none}
.item .cnt[hidden]{display:none}
.me{margin-top:auto;display:flex;align-items:center;gap:10px;background:#fff;border-radius:12px;padding:10px}
.me .av{
  width:38px;height:38px;border-radius:50%;background:#EEF1F6;color:var(--navy);
  font-weight:700;display:flex;align-items:center;justify-content:center;flex:none;
}
.me div{flex:1;min-width:0}
.me b{display:block;font-size:.95rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me small{color:var(--label2);font-size:.78rem}
.out{border:0;background:none;color:var(--red);font:inherit;font-weight:600;font-size:.88rem;cursor:pointer;padding:8px}

@media (min-width:900px){
  .topbar{
    height:48px;padding:0 16px;justify-content:space-between;gap:12px;
    background:rgba(255,255,255,.94);
  }
  #menuOpen,#appTitle{display:none}
  .frames{top:48px;left:0}
  .dsk-home{
    display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 12px;
    border:.5px solid var(--g2);border-radius:10px;background:var(--g1);color:#1C1C1E;
    font:inherit;font-size:.86rem;font-weight:600;cursor:pointer;
  }
  .dsk-home:hover{background:#E5E5EA}
  .dsk-home svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .dsk-tabs{display:inline-flex;align-items:center;gap:2px;padding:3px;border-radius:10px;background:var(--g1)}
  .dsk-tab{
    position:relative;display:inline-flex;align-items:center;gap:6px;min-height:30px;padding:0 14px;
    border:0;border-radius:8px;background:none;color:var(--l2);
    font:inherit;font-size:.85rem;font-weight:600;cursor:pointer;
  }
  .dsk-tab:hover{color:#000}
  .dsk-tab[data-app="daily"][aria-current="page"]{background:var(--red);color:#fff;box-shadow:0 1px 3px rgba(255,59,48,.28)}
  .dsk-tab[data-app="night"][aria-current="page"]{background:var(--navy);color:#fff;box-shadow:0 1px 3px rgba(28,43,90,.28)}
  .dsk-cnt{
    min-width:17px;height:17px;padding:0 5px;border-radius:9px;
    background:var(--red);color:#fff;font-size:.68rem;font-weight:800;
    display:inline-flex;align-items:center;justify-content:center;
  }
  .dsk-cnt[hidden]{display:none}
  .dsk-tab[aria-current="page"] .dsk-cnt{background:#fff;color:var(--navy)}
  .dsk-tab[data-app="daily"][aria-current="page"] .dsk-cnt{color:var(--red-ink)}
  .dsk-right{display:inline-flex;align-items:center;gap:6px}
  .dsk-me{
    position:relative;display:inline-flex;align-items:center;gap:7px;min-height:34px;max-width:210px;
    padding:0 11px 0 5px;border:0;border-radius:999px;background:var(--g1);color:#1C1C1E;
    font:inherit;font-size:.84rem;font-weight:600;cursor:pointer;
  }
  .dsk-me:hover{background:#E5E5EA}
  .dsk-av{
    width:26px;height:26px;border-radius:50%;background:#EEF1F6;color:var(--navy);
    font-size:.72rem;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none;
  }
  #topName{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dsk-pend{
    min-width:17px;height:17px;padding:0 5px;border-radius:9px;flex:none;
    background:var(--red);color:#fff;font-size:.68rem;font-weight:800;
    display:inline-flex;align-items:center;justify-content:center;
  }
  .dsk-pend[hidden]{display:none}
  .dsk-out{
    min-height:34px;padding:0 10px;border:0;border-radius:9px;background:none;
    color:var(--red-ink);font:inherit;font-size:.84rem;font-weight:600;cursor:pointer;
  }
  .dsk-out:hover{background:#FFE5E3}
  .side{border-right:.5px solid #D1D1D6}
  .sec{margin-top:16px}
}
body.locked .topbar,body.locked .side,body.locked .scrim{display:none}

/* Home dashboard */
.home{
  position:fixed;inset:0;z-index:15;background:#fff;overflow:auto;-webkit-overflow-scrolling:touch;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Noto Sans Thai","Leelawadee UI",system-ui,sans-serif;color:#000;
}
.home[hidden]{display:none}
body.at-home .topbar,body.at-home .side,body.at-home .scrim,body.at-home .frames{display:none}
.hm-in{max-width:640px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 16px calc(32px + env(safe-area-inset-bottom))}
.hm-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px}
.hm-date{margin:0;color:#3A3A3C;font-size:.9rem;font-weight:600}
.home h1{margin:2px 0 0;font-size:2.1rem;font-weight:700;letter-spacing:-.025em;line-height:1.1}
.hm-me{position:relative;width:40px;height:40px;border-radius:50%;border:0;padding:0;background:var(--g1);cursor:pointer;flex:none}
.hm-av{display:flex;width:100%;height:100%;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;color:#3A3A3C}
.hm-pend{
  position:absolute;top:-2px;right:-2px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;
  background:var(--red);color:#fff;font-size:.68rem;font-weight:800;
  display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px #fff;
}
.hm-pend[hidden]{display:none}
.hm-sync{
  display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;
  margin:0 0 14px;padding:10px 14px;border:0;border-radius:14px;
  background:#FFF1E0;color:#C93400;font:inherit;font-size:.85rem;font-weight:600;cursor:pointer;text-align:left;
}
.hm-sync[hidden]{display:none}
.hm-sync small{color:var(--tint);font-weight:700;white-space:nowrap}

.hm-week{margin-bottom:16px}
.hm-weekbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.hm-weekbar b{font-size:1.05rem;font-weight:600}
.hm-nav{display:flex;gap:4px}
.hm-ib{
  position:relative;width:44px;height:44px;border:0;border-radius:12px;
  background:none;color:#1C1C1E;display:flex;align-items:center;justify-content:center;cursor:pointer;
}
.hm-ib:active{background:var(--g1)}
.hm-ib svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hm-days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.hm-day{
  border:0;background:none;border-radius:14px;padding:6px 0 8px;
  display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;font:inherit;color:#000;min-height:64px;
}
.hm-day .w{font-size:.7rem;color:var(--l3);font-weight:600}

.hm-ct{flex:1;min-width:0}

.hm-prog{height:6px;border-radius:3px;background:var(--g1);overflow:hidden;margin:14px 0 0}
.hm-prog i{display:block;height:100%;width:0;background:var(--navy);border-radius:3px;transition:width .3s ease}
.hm-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;min-height:8px}
.hm-chip{font-size:.78rem;font-weight:600;padding:5px 10px;border-radius:999px;background:var(--g1);color:#3A3A3C}
.hm-chip.ok{background:#E8F8EC;color:var(--ok)}
.hm-chip.ng{background:#FFE5E3;color:var(--red-ink)}
.hm-chip.st{background:#FFF1E0;color:#C93400}
.hm-empty{color:var(--l3);font-size:.85rem}
.hm-acts{display:flex;gap:8px;margin-top:14px}
.hm-b{
  flex:1;min-height:44px;border:0;border-radius:12px;font:inherit;font-size:.95rem;font-weight:600;
  cursor:pointer;text-align:center;display:flex;align-items:center;justify-content:center;
}
.hm-b:active{transform:scale(.98)}
.hm-b.red{background:var(--red);color:#fff}
.hm-b.navy{background:var(--navy);color:#fff}
.hm-b.alt{background:var(--g1);color:#000}
.hm-foot{text-align:center;color:var(--l3);font-size:.75rem;margin:14px 0 0}
.hm-grid[hidden],.hm-card[hidden]{display:none}
@media (min-width:900px){
  .hm-in{max-width:980px;padding:28px 32px 48px}
  .hm-ib:hover,.hm-day:hover{background:var(--g1)}
  .hm-day[aria-pressed="true"]:hover{background:none}
  .hm-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:stretch}
  .hm-grid .hm-card{margin-bottom:0;padding:20px;display:flex;flex-direction:column}
  .hm-grid .hm-acts{margin-top:auto;padding-top:16px}

/* Login */
.login{
  position:fixed;inset:0;z-index:20;background:var(--bg);
  display:flex;align-items:center;justify-content:center;
  padding:24px 16px calc(24px + env(safe-area-inset-bottom));overflow:auto;
}
.login[hidden]{display:none}
.card{width:100%;max-width:380px;text-align:center}
.lg-logo{
  display:block;width:120px;height:120px;margin:0 auto 18px;border-radius:27px;
  box-shadow:0 10px 28px -8px rgba(11,42,107,.35),0 1px 2px rgba(11,42,107,.12);
}
.grp{background:var(--card);border-radius:14px;overflow:hidden;text-align:left;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.f{display:flex;align-items:center;min-height:52px;padding:0 16px;gap:12px}
.f+.f{border-top:.5px solid var(--sep)}
.f span,.f label{width:72px;flex:none}
.f input{flex:1;min-width:0;border:0;background:none;font:inherit;font-size:1rem;color:var(--label);height:50px;outline:none}
.pw-eye{
  width:40px;height:40px;margin-right:-8px;border:0;border-radius:10px;background:none;
  color:var(--l3);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;
}
.pw-eye:active{background:var(--g1)}
.pw-eye svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.err{min-height:1.4em;margin:10px 4px 6px;color:var(--red);font-size:.9rem;text-align:left}
.btn{width:100%;min-height:52px;border:0;border-radius:14px;background:var(--tint);color:#fff;font:inherit;font-size:1.05rem;font-weight:700;cursor:pointer}
.btn:disabled{opacity:.6}

/* Month picker & modal sheets */
.cal{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(0,0,0,.32);animation:alFade .2s ease}
.cal[hidden]{display:none}
.cal-box{
  width:100%;max-width:360px;background:#fff;border-radius:22px;padding:14px 14px 10px;
  box-shadow:0 24px 60px -16px rgba(0,0,0,.4);animation:alPop .25s cubic-bezier(.32,.72,0,1);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Noto Sans Thai","Leelawadee UI",system-ui,sans-serif;color:#000;
}
.cal-h{display:flex;align-items:center;justify-content:space-between;padding:0 2px 0 8px}
.cal-h b{font-size:1.05rem;font-weight:600}
.cal-h span{display:flex}
.cal-w,.cal-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));text-align:center}
.cal-w{margin:6px 0 2px;font-size:.72rem;font-weight:600;color:var(--l3)}
.cal-g button{
  position:relative;aspect-ratio:1;max-height:48px;border:0;background:none;
  font:inherit;font-size:1.02rem;font-weight:500;color:#000;cursor:pointer;
  display:flex;align-items:center;justify-content:center;padding:0;
}
.cal-g button span{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.cal-g button.today span{box-shadow:inset 0 0 0 1.5px #1C1C1E;font-weight:700}
.cal-g button[aria-pressed="true"] span{background:#1C1C1E;color:#fff;font-weight:700;box-shadow:none}
.cal-g button.future{color:#C7C7CC}
.cal-g button.has::after{content:"";position:absolute;bottom:2px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--l3)}
.cal-g button:hover span{background:var(--g1)}
.cal-g button[aria-pressed="true"]:hover span{background:#1C1C1E}
.cal-f{display:flex;justify-content:space-between;margin-top:6px;border-top:.5px solid var(--g2);padding-top:6px}
.cal-f button{min-height:44px;padding:0 14px;border:0;background:none;font:inherit;font-size:1rem;font-weight:600;color:#1C1C1E;cursor:pointer;border-radius:10px}
.cal-f button:active{background:var(--g1)}

/* Admin summary */
.adm-kpi{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:4px 0 12px}
.adm-kpi div{border:.5px solid var(--g2);border-radius:14px;padding:10px 12px;background:#fff}
.adm-kpi small{display:block;color:var(--l3);font-size:.72rem;font-weight:600}
.adm-kpi b{font-size:1.45rem;font-weight:700}
.adm-kpi b i{font-style:normal;font-size:.75rem;font-weight:500;color:var(--l3)}
.adm-acts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:0 0 12px}
.adm-act{
  display:flex;align-items:center;justify-content:center;gap:7px;min-height:44px;padding:8px 10px;
  border:.5px solid var(--g2);border-radius:12px;background:var(--g1);color:#000;
  font:inherit;font-size:.86rem;font-weight:600;cursor:pointer;
}
.adm-act:hover{background:#EAEAEF}
.adm-act:active{transform:scale(.98)}
.adm-act svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.adm-act.d svg{stroke:var(--red)}
.adm-act.n svg{stroke:var(--navy)}
.adm-act.u svg{stroke:var(--tint)}
.adm-tbl{border:.5px solid var(--g2);border-radius:16px;overflow:hidden;background:#fff}
.adm-row{
  display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,2fr) minmax(0,1.3fr) 54px 44px;
  align-items:center;gap:8px;padding:10px 12px;border:0;border-top:.5px solid #F0F0F2;
  width:100%;background:none;font:inherit;text-align:left;color:#000;
}
.adm-h{border-top:0;font-size:.72rem;font-weight:600;color:var(--l3);padding-top:8px;padding-bottom:8px}
button.adm-row{cursor:pointer;min-height:56px}
button.adm-row:hover{background:#F7F7FA}
.adm-row.off{opacity:.5}
.adm-who{display:flex;align-items:center;gap:8px;min-width:0}
.adm-who b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.adm-av{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:.72rem;font-weight:700;background:#EEF1F6;color:var(--navy)}
.adm-chips{display:flex;flex-wrap:wrap;gap:3px}
.adm-ns{font-size:.85rem}
.adm-ns .hm-prog{margin:4px 0 0;height:4px}
.adm-t{font-size:.78rem;color:var(--l3)}
.adm-go{color:var(--tint);font-weight:600;font-size:.85rem;text-align:right}
.adm-det{max-width:460px;max-height:86vh;overflow:auto}
.ad-sec{margin:12px 2px 6px;font-size:.78rem;font-weight:600;color:var(--l3)}
.ad-it{border:.5px solid var(--g2);border-radius:12px;padding:10px 12px;margin-bottom:6px}
.ad-it b{font-weight:600}
.ad-it small{display:block;color:var(--l2);font-size:.78rem;margin-top:2px}
.ad-it .bad{color:var(--red-ink)}
.ad-open{display:block;width:100%;min-height:44px;margin-top:6px;border:0;border-radius:12px;background:var(--g1);font:inherit;font-weight:600;cursor:pointer}
.ad-open:hover{background:#E5E5EA}
@media (min-width:900px){
  .adm-kpi{gap:12px;margin:6px 0 14px}
  .adm-kpi div{padding:14px 16px}
  .adm-acts{gap:12px;margin-bottom:14px}
  .adm-row{grid-template-columns:minmax(0,1.25fr) minmax(0,2.3fr) minmax(0,1.4fr) 68px 54px;gap:12px;padding:12px 16px}
  .adm-det{max-width:540px}
}
@media (max-width:560px){
  .adm-kpi{grid-template-columns:repeat(2,minmax(0,1fr))}
  .adm-acts{grid-template-columns:repeat(2,minmax(0,1fr))}
  .adm-act:last-child{grid-column:1 / -1}
  .adm-h{display:none}
  div.adm-row:not(.adm-h){grid-template-columns:1fr}
  button.adm-row{grid-template-columns:minmax(0,1fr) auto auto;gap:6px 8px;padding:12px}
  button.adm-row .adm-who{grid-column:1}
  button.adm-row .adm-t{grid-column:2}
  button.adm-row .adm-go{grid-column:3}
  button.adm-row .adm-chips{grid-column:1 / -1;padding-left:38px;align-items:center}
  button.adm-row:not(.off) .adm-chips::before{content:"Daily:";font-size:.72rem;font-weight:600;color:var(--l3);margin-right:4px}
  button.adm-row .adm-ns{grid-column:1 / -1;padding-left:38px;display:flex;align-items:center;gap:8px;font-size:.8rem}
  button.adm-row .adm-ns::before{content:"กะดึก:";font-size:.72rem;font-weight:600;color:var(--l3);flex:none}
  button.adm-row .adm-ns .hm-prog{flex:1;max-width:96px;margin:0}
  button.adm-row.off .adm-ns{display:none}
}

/* Account & Logout dialogs */
.ac-box{max-width:340px;padding:18px 16px 14px;text-align:center}
.ac-av{
  width:56px;height:56px;margin:0 auto 10px;border-radius:50%;
  background:#EEF1F6;color:var(--navy);font-size:1.15rem;font-weight:700;
  display:flex;align-items:center;justify-content:center;
}
.ac-name{font-size:1.1rem;font-weight:700;margin:0}
.ac-meta{margin:4px 0 14px;font-size:.82rem;color:var(--l2)}
.ac-role{display:inline-block;padding:2px 8px;border-radius:999px;background:var(--g1);color:#3A3A3C;font-weight:600;font-size:.75rem}
.ac-sync{padding:10px 12px;border-radius:12px;font-size:.84rem;font-weight:600;text-align:left;margin-bottom:12px;line-height:1.45}
.ac-sync.ok{background:#E8F8EC;color:var(--ok)}
.ac-sync.wait{background:#FFF1E0;color:#C93400}
.ac-sync button{
  display:block;width:100%;margin-top:8px;min-height:38px;border:0;border-radius:10px;
  background:#fff;color:#C93400;font:inherit;font-size:.82rem;font-weight:700;cursor:pointer;
}
.ac-btns{display:flex;flex-direction:column;gap:8px}
.ac-btns button{min-height:44px;border:0;border-radius:12px;font:inherit;font-size:.95rem;font-weight:600;cursor:pointer}
.ac-btns .sec-btn{background:var(--g1);color:#000}
.ac-btns .out-btn{background:#FFE5E3;color:var(--red-ink)}

.al{position:fixed;inset:0;z-index:45;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(0,0,0,.32);animation:alFade .2s ease}
.al[hidden]{display:none}
.al-box{
  width:100%;max-width:300px;border-radius:14px;overflow:hidden;text-align:center;
  background:rgba(246,246,248,.94);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);
  box-shadow:0 20px 50px -12px rgba(0,0,0,.35);animation:alPop .25s cubic-bezier(.32,.72,0,1);
}
.al-box h2{margin:0;padding:20px 16px 18px;font-size:1.05rem;font-weight:600}
.al-box p{margin:-10px 16px 18px;font-size:.84rem;line-height:1.45;color:#3C3C43}
.al-box p.warn{color:var(--red-ink);font-weight:600}
.al-box p[hidden]{display:none}
.al-acts{display:flex;border-top:.5px solid var(--sep)}
.al-acts button{flex:1;min-height:46px;border:0;background:none;font:inherit;font-size:1.02rem;color:var(--tint);cursor:pointer}
.al-acts button+button{border-left:.5px solid var(--sep)}
.al-acts button:active{background:rgba(0,0,0,.06)}
.al-acts .danger{color:var(--red);font-weight:600}
@keyframes alFade{from{opacity:0}}
@keyframes alPop{from{transform:scale(1.12);opacity:0}}
@media (prefers-reduced-motion:reduce){.al,.al-box{animation:none}}
</style>

<script src="tasks.js"></script>
<script>
const V = '20261125i';
const APPS = { daily: 'daily_inspection_mobile.html?v=' + V, night: 'index.html?v=' + V };
const DAILY_API = 'https://script.google.com/macros/s/AKfycbxuM2GmQGbDG7tLM0uQiqsEvHcqeEQ8M93e6qsIn06fAmSB8MUMGz7mh-nRX8ZOUc6H9Q/exec';

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const ls = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} },
  json(k) { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch { return null; } },
};
const post = async (url, body) => {
  const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
  return r.json();
};

const dailySession = () => { const s = ls.json('di_user'); return s && s.token ? s : null; };
const nightSession = () => { const u = (ls.json('nsp') || {}).user; return u && u.token ? u : null; };

let current = ls.get('shell_tab') === 'night' ? 'night' : 'daily';
const frames = {};
function frame(app) {
  if (!frames[app]) {
    const f = document.createElement('iframe');
    f.title = app === 'daily' ? 'Daily Inspection' : 'Night Shift Plan';
    f.src = APPS[app];
    f.hidden = true;
    f.addEventListener('load', () => { f.dataset.ready = '1'; });
    $('frames').appendChild(f);
    frames[app] = f;
  }
  return frames[app];
}

const TITLES = { daily: 'Daily Inspection', night: 'Night Shift' };
const LOCAL = !/^https?:$/.test(location.protocol);
function localNotice() {
  $('frames').innerHTML = `<div style="max-width:420px;margin:15vh auto 0;padding:24px;text-align:center;color:#3A4256;line-height:1.6">
    <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M11 18.5h2"/></svg>
    <h2 style="margin:10px 0 8px;font-size:1.2rem">เปิดจากไฟล์ในเครื่องไม่ได้</h2>
    <p style="margin:0 0 16px;color:var(--label2)">หน้านี้ต้องเปิดผ่านเว็บ ฟอร์ม Daily และ Night Shift ถึงจะขึ้น อัปโหลดขึ้น GitHub แล้วเปิดลิงก์นี้</p>
    <a href="https://wongnantananthaya-ai.github.io/Daily/app.html" style="color:var(--tint);font-weight:600;word-break:break-all">wongnantananthaya-ai.github.io/Daily/app.html</a></div>`;
}

/* Home state & Thai date helpers */
const HM = { sel: '', daily: null, night: {}, loadingNight: '' };
const TH_W = ['อา', 'จ', 'อ', 'พ', 'พฤ', 'ศ', 'ส'];
const TH_WL = ['อาทิตย์', 'จันทร์', 'อังคาร', 'พุธ', 'พฤหัสบดี', 'ศุกร์', 'เสาร์'];
const TH_M = ['มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน', 'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'];
const TH_MS = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
const ymd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const pd = s => new Date(+s.slice(0, 4), +s.slice(5, 7) - 1, +s.slice(8, 10));
const addDays = (s, n) => { const d = pd(s); d.setDate(d.getDate() + n); return ymd(d); };
const todayStr = () => ymd(new Date());
// กะดึกนับตามคืนที่เริ่มงาน (20:00-08:00) ถ้าเปิดก่อน 08:00 ของวันนี้ยังเป็นกะเมื่อคืน
const nightOf = d => (d === todayStr() && new Date().getHours() < 8) ? addDays(d, -1) : d;
const thShort = s => { const d = pd(s); return `${d.getDate()} ${TH_MS[d.getMonth()]} ${d.getFullYear() + 543}`; };
const localNights = () => {
  const s = new Set();
  Object.keys(((ls.json('nsp') || {}).rec) || {}).forEach(k => { const d = k.split('|')[1]; if (d) s.add(d); });
  return s;
};

function hmRender() {
  const sel = HM.sel, t = todayStr(), mon = addDays(sel, -((pd(sel).getDay() + 6) % 7));
  const sd = pd(sel);
  $('hmToday').textContent = `วัน${TH_WL[sd.getDay()]}ที่ ${sd.getDate()} ${TH_M[sd.getMonth()]} ${sd.getFullYear() + 543}${sel === t ? ' · วันนี้' : ''}`;
  $('hmMonth').textContent = `${TH_M[sd.getMonth()]} ${sd.getFullYear() + 543}`;

  const dDays = new Set((HM.daily || []).map(r => r.date)), nDays = localNights();
  Object.entries(HM.night).forEach(([d, st]) => { if (st && Object.keys(st).length) nDays.add(d); });
  $('hmDays').innerHTML = Array.from({ length: 7 }, (_, i) => {
    const d = addDays(mon, i), dt = pd(d);
    return `<button type="button" class="hm-day ${d === t ? 'today' : ''} ${d > t ? 'future' : ''}" data-day="${d}" aria-pressed="${d === sel}" aria-label="${TH_WL[dt.getDay()]} ${dt.getDate()} ${TH_M[dt.getMonth()]}">
      <span class="w">${TH_W[dt.getDay()]}</span><span class="d">${dt.getDate()}</span>
      <span class="hm-dots">${dDays.has(d) || nDays.has(d) ? '<i class="dd"></i>' : ''}</span></button>`;
  }).join('');
  $('hmGoToday').hidden = sel === t;
  if (!$('cal').hidden) calRender();

  // Daily summary
  $('hmDSub').textContent = 'วันที่ ' + thShort(sel);
  if (!HM.daily) {
    $('hmDStat').innerHTML = '';
    $('hmDChips').innerHTML = '<span class="hm-empty">กำลังโหลด…</span>';
  } else {
    const recs = HM.daily.filter(r => r.date === sel).sort((a, b) => (a.type + a.no).localeCompare(b.type + b.no));
    const bad = recs.filter(r => r.result === 'ผิดปกติ').length;
    $('hmDStat').innerHTML = `${recs.length}<small>เครื่อง${bad ? ` · ผิดปกติ ${bad}` : ''}</small>`;
    $('hmDStat').style.color = bad ? 'var(--red-ink)' : '#000';
    $('hmDChips').innerHTML = recs.length
      ? recs.map(r => `<span class="hm-chip ${r.result === 'ผิดปกติ' ? 'ng' : r.result === 'Stop' ? 'st' : 'ok'}">${esc(r.type)} ${esc(r.no)} ${r.result === 'ผิดปกติ' ? '!' : r.result === 'Stop' ? 'Stop' : '✓'}</span>`).join('')
      : `<span class="hm-empty">${sel > t ? 'ยังไม่ถึงวันนี้' : 'ยังไม่มีการตรวจวันนี้'}</span>`;
  }

  // Night Shift summary
  const ns = nightOf(sel), nsD = pd(ns), nsN = pd(addDays(ns, 1));
  $('hmNSub').textContent = `${nsD.getDate()} ${TH_MS[nsD.getMonth()]} 20:00 – ${nsN.getDate()} ${TH_MS[nsN.getMonth()]} 08:00`;
  const st = HM.night[ns];
  if (st === undefined) {
    $('hmNStat').innerHTML = '';
    $('hmNBar').style.width = '0';
    $('hmNChips').innerHTML = '<span class="hm-empty">กำลังโหลด…</span>';
  } else {
    const tasks = st.tasks || {}, list = (typeof TASKS !== 'undefined' && TASKS[nsD.getDay()]) || [];
    const done = Object.keys(tasks).filter(k => /^t\d+$/.test(k) && tasks[k].v === '✓').length, total = list.length || done;
    let ng = 0;
    const forms = [['sub1', 'Sub 1'], ['sub2', 'Sub 2'], ['adrain', 'Auto drain'], ['light', 'Light']].map(([k, n]) => {
      const vals = Object.entries(st[k] || {}).filter(([id]) => !id.startsWith('_')).map(([, x]) => x.v).filter(v => v !== '');
      const bad = vals.filter(v => v === 'NG' || v === 'ผิดปกติ').length;
      ng += bad;
      return `<span class="hm-chip ${bad ? 'ng' : vals.length ? 'ok' : ''}">${n} ${bad ? 'NG ' + bad : vals.length ? '✓' : '–'}</span>`;
    });
    $('hmNStat').innerHTML = total ? `${done}/${total}<small>งาน${ng ? ` · NG ${ng}` : ''}</small>` : `–<small>งาน</small>`;
    $('hmNStat').style.color = ng ? 'var(--red-ink)' : '#000';
    $('hmNBar').style.width = total ? Math.round(done / total * 100) + '%' : '0';
    $('hmNChips').innerHTML = Object.keys(st).length ? forms.join('') : `<span class="hm-empty">${ns > nightOf(t) ? 'ยังไม่ถึงคืนนี้' : 'ยังไม่มีการกรอกคืนนี้'}</span>`;
  }

  const adm = isAdmin();
  $('hmGrid').hidden = adm;
  document.querySelectorAll('.hm-card').forEach(c => { c.hidden = adm; });
  $('admBox').hidden = !adm;
  $('hmTitle').textContent = adm ? 'ผู้ดูแล' : 'Inspection';
  if (adm) admRender();
  const d = dailySession() || nightSession();
  $('hmFoot').textContent = d ? `${d.name}${d.admin ? ' · admin (เห็นข้อมูลทุกคน · แก้ได้เฉพาะที่กรอกแล้ว)' : ' · เห็นข้อมูลที่ตัวเองกรอก'}` : '';
}


/* Admin view */
const isAdmin = () => !!((dailySession() || nightSession() || {}).admin);
const DAILY_N = { ACP: 'Air Compressor', AD: 'Air Dryer', CT: 'Cooling Tower' };
const FORM_N = { sub1: 'Sub 1', sub2: 'Sub 2', adrain: 'Auto drain', light: 'Light' };

async function hmLoadUsers() {
  const s = dailySession() || nightSession();
  try {
    const j = await post(DAILY_API, { action: 'users', token: s.token });
    if (j && j.ok) HM.users = j.users || [];
  } catch {}
  if (!$('home').hidden) hmRender();
}

function admWork(p) {
  const sel = HM.sel, ns = nightOf(sel), st = HM.night[ns] || {};
  const mine = r => r.user ? r.user === p.user : r.inspector === p.name;
  const daily = (HM.daily || []).filter(r => r.date === sel && mine(r)).sort((a, b) => (a.type + a.no).localeCompare(b.type + b.no));
  let tasks = 0, last = '';
  const forms = {};
  Object.entries(st).forEach(([form, fs]) => Object.entries(fs).forEach(([id, x]) => {
    if (x.by !== p.name || x.v === '') return;
    if (form === 'tasks') { if (/^t\d+$/.test(id) && x.v === '✓') tasks++; }
    else if (!id.startsWith('_')) forms[form] = (forms[form] || 0) + 1;
    if (x.at && x.at > last) last = x.at;
  }));
  daily.forEach(r => {
    const m = /(\d{2})\/(\d{2})\/(\d{4}) (\d{2}:\d{2})/.exec(r.saved);
    if (m) { const t = `${m[3]}-${m[2]}-${m[1]} ${m[4]}`; if (t > last) last = t; }
  });
  return { daily, tasks, forms, last, any: daily.length || tasks || Object.keys(forms).length };
}

const admChip = r => `<span class="hm-chip ${r.result === 'ผิดปกติ' ? 'ng' : r.result === 'Stop' ? 'st' : 'ok'}">${esc(r.type)} ${esc(r.no)} ${r.result === 'ผิดปกติ' ? '!' : r.result === 'Stop' ? 'Stop' : '✓'}</span>`;

function admRender() {
  const sel = HM.sel, ns = nightOf(sel), st = HM.night[ns];
  const total = (typeof TASKS !== 'undefined' && TASKS[pd(ns).getDay()] || []).length;
  const people = (HM.users || []).filter(u => u.active && !u.admin).map(u => ({ user: u.user, name: u.name }));
  const known = new Set(people.map(p => p.user));
  (HM.daily || []).filter(r => r.date === sel && r.user && !known.has(r.user)).forEach(r => {
    known.add(r.user);
    people.push({ user: r.user, name: r.inspector || r.user });
  });
  const rows = people.map(p => ({ p, w: admWork(p) })).sort((a, b) => (b.w.any ? 1 : 0) - (a.w.any ? 1 : 0) || (b.w.last > a.w.last ? 1 : -1));
  const dayRecs = (HM.daily || []).filter(r => r.date === sel);
  const done = st ? Object.keys(st.tasks || {}).filter(k => /^t\d+$/.test(k) && st.tasks[k].v === '✓').length : 0;
  const bad = dayRecs.filter(r => r.result === 'ผิดปกติ').length;

  $('admKpi').innerHTML = `<div><small>ผู้ตรวจที่กรอก</small><b>${rows.filter(x => x.w.any).length}<i> / ${people.length} คน</i></b></div>
    <div><small>Daily ตรวจแล้ว</small><b>${dayRecs.length}<i> เครื่อง</i></b></div>
    <div><small>ผิดปกติ</small><b style="color:${bad ? 'var(--red-ink)' : '#000'}">${bad}</b></div>
    <div><small>กะดึก</small><b>${st ? done : '–'}<i> / ${total || '–'} งาน</i></b></div>`;

  $('admRows').innerHTML = !HM.users ? '<div class="adm-row"><span class="hm-empty">กำลังโหลด…</span></div>'
    : !rows.length ? '<div class="adm-row"><span class="hm-empty">ยังไม่มีผู้ตรวจในแท็บผู้ใช้</span></div>'
    : rows.map(({ p, w }) => {
      const ini = Array.from(p.name).filter(ch => /[ก-ฮA-Za-z0-9]/.test(ch)).slice(0, 2).join('') || '?';
      const nf = Object.values(w.forms).reduce((a, b) => a + b, 0);
      return `<button type="button" class="adm-row ${w.any ? '' : 'off'}" data-adm="${esc(p.user)}" ${w.any ? '' : 'disabled'}>
        <span class="adm-who"><span class="adm-av">${esc(ini)}</span><b>${esc(p.name)}</b></span>
        <span class="adm-chips">${w.daily.length ? w.daily.map(admChip).join('') : `<span class="hm-empty">${w.any ? '–' : 'ยังไม่กรอก'}</span>`}</span>
        <span class="adm-ns">${w.tasks || nf ? `${w.tasks}${total ? '/' + total : ''} งาน${nf ? ` · ${nf} ช่อง` : ''}<div class="hm-prog"><i style="width:${total ? Math.round(w.tasks / total * 100) : 0}%"></i></div>` : '<span class="hm-empty">–</span>'}</span>
        <span class="adm-t">${w.last ? w.last.slice(11) : '–'}</span><span class="adm-go">${w.any ? 'ดู ›' : ''}</span></button>`;
    }).join('');
}

function admOpen(user) {
  const p = (HM.users || []).find(u => u.user === user) || { user, name: ((HM.daily || []).find(r => r.user === user) || {}).inspector || user };
  const w = admWork(p), sel = HM.sel, ns = nightOf(sel), nd = pd(ns);
  const total = (typeof TASKS !== 'undefined' && TASKS[nd.getDay()] || []).length;
  $('adT').textContent = `${p.name} · ${thShort(sel)}`;
  let h = `<div class="ad-sec">Daily Inspection · ${w.daily.length} เครื่อง</div>`;
  h += w.daily.length ? w.daily.map(r => `<div class="ad-it"><b>${esc(DAILY_N[r.type] || r.type)} NO. ${esc(r.no)}</b> ${admChip(r)}
      <small>${r.status && r.status !== 'Running' ? esc(r.status) + ' · ' : ''}บันทึก ${esc(r.saved || '–')}</small>
      ${r.issues.length ? `<small class="bad">ผิดปกติ: ${r.issues.map(esc).join(' · ')}</small>` : ''}</div>`).join('')
    + `<button type="button" class="ad-open" data-adopen="daily">เปิดดู / แก้ใน Daily</button>`
    : '<div class="ad-it"><small>ไม่ได้ตรวจ Daily วันนี้</small></div>';
  h += `<div class="ad-sec">Night Shift · คืน ${nd.getDate()} ${TH_MS[nd.getMonth()]} 20:00–08:00</div>`;
  const nf = Object.entries(w.forms);
  h += w.tasks || nf.length ? `<div class="ad-it"><b>งานคืนนี้ ${w.tasks}${total ? '/' + total : ''}</b>
      ${nf.length ? `<small>เช็คชีต: ${nf.map(([k, n]) => `${FORM_N[k] || k} ${n} ช่อง`).join(' · ')}</small>` : ''}
      <small>ล่าสุด ${esc(w.last ? w.last.slice(11) : '–')}</small></div>
      <button type="button" class="ad-open" data-adopen="night">เปิดดู / แก้กะดึกคืนนี้</button>`
    : '<div class="ad-it"><small>ไม่ได้กรอกกะดึกคืนนี้</small></div>';
  $('adBody').innerHTML = h;
  $('admDet').hidden = false;
}

$('admActs').addEventListener('click', e => {

  if (!b) return;
  const target = b.dataset.admGo;
  leaveHome();

    show('daily');
    callApp('daily', w => w.shellOpenTeam ? w.shellOpenTeam() : w.document.getElementById('teamBtn')?.click());
    return;
  }
  const d = target === 'night' ? nightOf(HM.sel) : HM.sel;
  show(target);
  callApp(target, w => w.shellOpenDate && w.shellOpenDate(d, true));
});
$('admRows').addEventListener('click', e => { const b = e.target.closest('[data-adm]'); if (b) admOpen(b.dataset.adm); });
$('adX').addEventListener('click', () => { $('admDet').hidden = true; });
$('admDet').addEventListener('click', e => {
  if (e.target === $('admDet')) { $('admDet').hidden = true; return; }
  const o = e.target.closest('[data-adopen]');
  if (!o) return;
  const app = o.dataset.adopen, d = app === 'night' ? nightOf(HM.sel) : HM.sel;
  $('admDet').hidden = true;
  leaveHome();
  show(app);
  callApp(app, w => w.shellOpenDate && w.shellOpenDate(d, true));
});
addEventListener('keydown', e => { if (e.key === 'Escape' && !$('admDet').hidden) $('admDet').hidden = true; });

function mergeLocalDaily(base) {
  const s = dailySession(), local = (ls.json('daily_inspection_records_v1') || []).filter(r => !r.demo);
  const out = [...(base || [])];
  const seen = new Set(out.map(r => `${r.date}|${r.type}|${r.no}`));
  local.forEach(r => {
    const no = String(r.machineNo || '').trim(), key = `${r.date}|${r.type}|${no}`;
    if (!r.date || !r.type || !no || seen.has(key)) return;
    seen.add(key);
    const st = String(r.status || '');
    const hasNg = Object.values(r.data || {}).some(v => v === 'ผิดปกติ');
    out.push({
      date: String(r.date), type: r.type, no,
      result: st === 'M/C Stop' ? 'Stop' : hasNg ? 'ผิดปกติ' : 'ปกติ',
      inspector: String((r.data && r.data.inspector) || (s && s.name) || ''),
      user: String((s && s.user) || '').toLowerCase(),
      saved: String(r.savedAt || ''), status: st, issues: [],
    });
  });
  return out;
}

async function hmLoadDaily() {
  const s = dailySession();
  let ok = false;
  try {
    const j = s ? await post(DAILY_API, { action: 'list', token: s.token }) : null;
    if (j && j.ok) {
      HM.daily = mergeLocalDaily((j.records || []).map(r => ({
        date: String(r.date), type: r.type, no: String(r.no), result: r.result || '',
        inspector: String(r.inspector || ''), user: String(r.user || '').toLowerCase(),
        saved: String(r.saved || ''), status: String(r.status || ''),
        issues: (r.issueList || []).map(i => i.label),
      })));
      ok = true;
    } else if (j && j.auth === false) return signOutAll();
  } catch {}
  if (!ok) HM.daily = mergeLocalDaily(HM.daily);
  if (!$('home').hidden) hmRender();
}

function localNightState(date, base) {
  const nsp = ls.json('nsp') || {}, rec = nsp.rec || {}, q = nsp.q || [], s = dailySession() || nightSession() || {};
  const st = base ? JSON.parse(JSON.stringify(base)) : {};
  if (!base) {
    Object.entries(rec).forEach(([k, v]) => {
      const [f, d] = k.split('|');
      if (d !== date) return;
      const who = v._who || {};
      st[f] = Object.fromEntries(Object.entries(v).filter(([id]) => !id.startsWith('_')).map(([id, x]) => [id, { v: x === true ? '✓' : String(x ?? ''), by: who[id] || s.name || '' }]));
    });
  }
  q.filter(x => x.date === date).forEach(x => {
    st[x.form] = st[x.form] || {};
    st[x.form][x.id] = { v: String(x.v ?? ''), by: s.name || '' };
  });
  return st;
}

async function hmLoadNight(date) {
  const s = dailySession() || nightSession();
  HM.loadingNight = date;
  let ok = false;
  try {
    const j = s ? await post(DAILY_API, { action: 'get', date, token: s.token }) : null;
    if (j && j.ok) {
      HM.night[date] = localNightState(date, j.state || {});
      ok = true;
    } else if (j && j.auth === false) return signOutAll();
  } catch {}
  if (!ok) HM.night[date] = localNightState(date, HM.night[date]);
  if (!$('home').hidden && nightOf(HM.sel) === date) hmRender();
}

function hmSelect(d) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(d || '')) return;
  HM.sel = d;
  hmRender();
  if (HM.night[nightOf(d)] === undefined) hmLoadNight(nightOf(d));
}

function showHome() {
  document.body.classList.add('at-home');
  $('home').hidden = false;
  closeMenu();
  document.title = 'Inspection';
  if (!HM.sel) HM.sel = todayStr();
  refreshMe();
  hmRender();
  hmLoadDaily();
  hmLoadNight(nightOf(HM.sel));
  if (isAdmin()) hmLoadUsers();
  preloadApps();
}

let preloaded = false;
function preloadApps() {
  if (preloaded || LOCAL) return;
  preloaded = true;
  const go = () => { frame('daily'); frame('night'); };
  setTimeout(() => (window.requestIdleCallback ? requestIdleCallback(go, { timeout: 3000 }) : go()), 2500);
}

function leaveHome() {
  document.body.classList.remove('at-home');
  $('home').hidden = true;
}

function callApp(app, fn) {
  const f = frame(app), run = () => { try { fn(f.contentWindow); } catch (e) {} };
  if (f.dataset.ready) run();
  else f.addEventListener('load', () => setTimeout(run, 400), { once: true });
}

$('hmDays').addEventListener('click', e => { const b = e.target.closest('[data-day]'); if (b) hmSelect(b.dataset.day); });
$('hmPrev').addEventListener('click', () => hmSelect(addDays(HM.sel, -7)));
$('hmNext').addEventListener('click', () => hmSelect(addDays(HM.sel, 7)));

/* Month calendar dialog */
const CAL = { m: '' };
function calRender() {
  const [y, m] = CAL.m.split('-').map(Number), first = new Date(y, m - 1, 1), days = new Date(y, m, 0).getDate(), t = todayStr();
  const has = new Set((HM.daily || []).map(r => r.date));
  localNights().forEach(d => has.add(d));
  Object.entries(HM.night).forEach(([d, st]) => { if (st && Object.keys(st).length) has.add(d); });
  $('calT').textContent = `${TH_M[m - 1]} ${y + 543}`;
  let h = '<span></span>'.repeat(first.getDay());
  for (let i = 1; i <= days; i++) {
    const d = `${CAL.m}-${String(i).padStart(2, '0')}`;
    h += `<button type="button" data-cd="${d}" class="${d === t ? 'today' : ''} ${d > t ? 'future' : ''} ${has.has(d) ? 'has' : ''}" aria-pressed="${d === HM.sel}" aria-label="${i} ${TH_M[m - 1]}${has.has(d) ? ' มีข้อมูล' : ''}"><span>${i}</span></button>`;
  }
  $('calG').innerHTML = h;
}
const calShift = n => { const [y, m] = CAL.m.split('-').map(Number), d = new Date(y, m - 1 + n, 1); CAL.m = ymd(d).slice(0, 7); calRender(); };
function calOpen() {
  CAL.m = HM.sel.slice(0, 7);
  calRender();
  $('cal').hidden = false;
  setTimeout(() => $('calG').querySelector('[aria-pressed="true"]')?.focus(), 30);
}
const calClose = () => { $('cal').hidden = true; $('hmCalBtn').focus(); };
$('hmCalBtn').addEventListener('click', calOpen);
$('calPrev').addEventListener('click', () => calShift(-1));
$('calNext').addEventListener('click', () => calShift(1));
$('calClose').addEventListener('click', calClose);
$('calToday').addEventListener('click', () => { hmSelect(todayStr()); calClose(); });
$('calG').addEventListener('click', e => { const b = e.target.closest('[data-cd]'); if (b) { hmSelect(b.dataset.cd); calClose(); } });
$('cal').addEventListener('click', e => { if (e.target === $('cal')) calClose(); });
addEventListener('keydown', e => { if (e.key === 'Escape' && !$('cal').hidden) calClose(); });

$('hmGoToday').addEventListener('click', () => hmSelect(todayStr()));
document.querySelectorAll('[data-open]').forEach(b => b.addEventListener('click', () => {
  const app = b.dataset.open, view = !!b.dataset.view, d = app === 'night' ? nightOf(HM.sel) : HM.sel;
  leaveHome();
  show(app);
  callApp(app, w => w.shellOpenDate && w.shellOpenDate(d, view));
}));
$('goHome').addEventListener('click', showHome);

function queueCounts() {
  return { dq: (ls.json('di_sync_queue') || []).length, nq: ((ls.json('nsp') || {}).q || []).length };
}
function openPendingApp() {
  const { dq } = queueCounts(), app = dq ? 'daily' : 'night';
  const d = app === 'night' ? nightOf(HM.sel || todayStr()) : (HM.sel || todayStr());
  $('acctDlg').hidden = true;
  leaveHome();
  show(app);
  callApp(app, w => w.shellOpenDate && w.shellOpenDate(d, false));
}
function renderAcctSync() {
  const { dq, nq } = queueCounts(), tot = dq + nq, el = $('acSync');
  if (!tot) {
    el.className = 'ac-sync ok';
    el.textContent = '✓ ซิงก์ข้อมูลขึ้น Google Sheet ครบแล้ว';
  } else {
    const parts = [];
    if (dq) parts.push(`Daily ${dq} รายการ`);
    if (nq) parts.push(`Night Shift ${nq} ช่อง`);
    el.className = 'ac-sync wait';
    el.innerHTML = `รอส่งข้อมูลขึ้นระบบ: ${parts.join(' · ')}<button type="button" id="acSyncGo">เปิดหน้าเพื่อส่งข้อมูลตอนนี้</button>`;
  }
}
function openAcct() {
  const s = dailySession() || nightSession() || {};
  $('acAv').textContent = $('meAv').textContent;
  $('acName').textContent = s.name || '-';
  $('acUser').textContent = s.user ? '@' + s.user : '';
  $('acRole').textContent = s.admin ? 'admin' : 'ผู้ตรวจ';
  renderAcctSync();
  $('acctDlg').hidden = false;
  setTimeout(() => $('acClose').focus(), 30);
}
const closeAcct = () => { $('acctDlg').hidden = true; };
$('hmMe').addEventListener('click', openAcct);
$('hmSyncWarn').addEventListener('click', openPendingApp);
$('acClose').addEventListener('click', closeAcct);
$('acctDlg').addEventListener('click', e => {
  if (e.target === $('acctDlg')) closeAcct();
  if (e.target.id === 'acSyncGo') openPendingApp();
});
$('acLogout').addEventListener('click', () => { closeAcct(); askLogout(); });

function askLogout() {
  const s = dailySession() || nightSession() || {};
  const { dq, nq } = queueCounts(), tot = dq + nq, msg = $('alMsg');
  if (tot) {
    msg.className = 'warn';
    msg.textContent = `บัญชี ${s.name || '-'} ยังมีข้อมูลค้างส่ง ${tot} รายการ หากออกตอนนี้ข้อมูลที่ยังไม่ส่งอาจสูญหาย`;
    msg.hidden = false;
  } else if (s.name) {
    msg.className = '';
    msg.textContent = `บัญชีผู้ใช้: ${s.name}`;
    msg.hidden = false;
  } else msg.hidden = true;
  $('alOut').hidden = false;
  setTimeout(() => $('alNo').focus(), 30);
}
const closeAl = () => { $('alOut').hidden = true; };
$('alNo').addEventListener('click', closeAl);
$('alYes').addEventListener('click', () => { closeAl(); signOutAll(); });
$('alOut').addEventListener('click', e => { if (e.target === $('alOut')) closeAl(); });
addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (!$('alOut').hidden) closeAl();
    else if (!$('acctDlg').hidden) closeAcct();
  }
});

function show(app) {
  current = app;
  ls.set('shell_tab', app);
  if (LOCAL) {
    document.querySelectorAll('[data-app]').forEach(b => b.dataset.app === app ? b.setAttribute('aria-current', 'page') : b.removeAttribute('aria-current'));
    $('appTitle').textContent = TITLES[app];
    closeMenu();
    return localNotice();
  }
  frame(app).hidden = false;
  Object.entries(frames).forEach(([k, f]) => { if (k !== app) f.hidden = true; });
  document.querySelectorAll('[data-app]').forEach(b => b.dataset.app === app ? b.setAttribute('aria-current', 'page') : b.removeAttribute('aria-current'));
  $('appTitle').textContent = TITLES[app];
  document.title = TITLES[app];
  closeMenu();
}
document.querySelectorAll('[data-app]').forEach(b => b.addEventListener('click', () => show(b.dataset.app)));
$('topHome').addEventListener('click', showHome);
$('topMe').addEventListener('click', openAcct);
$('topOut').addEventListener('click', askLogout);

/* Drawer toggle */
function openMenu() {
  document.body.classList.add('menu-open');
  $('menuOpen').setAttribute('aria-expanded', 'true');
  setTimeout(() => document.querySelector('.side [aria-current]')?.focus(), 50);
}
function closeMenu() {
  document.body.classList.remove('menu-open');
  $('menuOpen').setAttribute('aria-expanded', 'false');
}
$('menuOpen').addEventListener('click', openMenu);
$('menuClose').addEventListener('click', closeMenu);
$('scrim').addEventListener('click', closeMenu);
addEventListener('keydown', e => { if (e.key === 'Escape') closeMenu(); });

/* Session & sync badge status */
function refreshMe() {
  const d = dailySession(), n = nightSession(), name = (d && d.name) || (n && n.name) || '-';
  $('meName').textContent = name;
  $('meAv').textContent = Array.from(name).filter(ch => /[ก-ฮA-Za-z0-9]/.test(ch)).slice(0, 2).join('') || '?';
  $('meRole').textContent = d && d.admin ? 'admin' : 'ผู้ตรวจ';
  const { dq, nq } = queueCounts(), tot = dq + nq;
  $('cntDaily').hidden = !dq;
  $('cntDaily').textContent = dq;
  $('cntNight').hidden = !nq;
  $('cntNight').textContent = nq;
  $('topCntDaily').hidden = !dq;
  $('topCntDaily').textContent = dq;
  $('topCntNight').hidden = !nq;
  $('topCntNight').textContent = nq;
  $('topAv').textContent = $('meAv').textContent;
  $('topName').textContent = name;
  $('topPend').hidden = !tot;
  $('topPend').textContent = tot;
  $('hmAv').textContent = $('meAv').textContent;
  $('hmPend').hidden = !tot;
  $('hmPend').textContent = tot;
  $('hmSyncWarn').hidden = !tot;
  if (tot) {
    const parts = [];
    if (dq) parts.push(`Daily ${dq}`);
    if (nq) parts.push(`Night Shift ${nq}`);
    $('hmSyncWarn').innerHTML = `<span>มีงานรอส่งขึ้นระบบ (${parts.join(' · ')})</span><small>เปิดส่ง ›</small>`;
  }
  if (!$('acctDlg').hidden) renderAcctSync();
}
setInterval(refreshMe, 3000);
$('logout').addEventListener('click', askLogout);

function openApps() {
  $('login').hidden = true;
  document.body.classList.remove('locked');
  Object.values(frames).forEach(f => f.remove());
  for (const k in frames) delete frames[k];
  preloaded = false;
  HM.daily = null;
  HM.night = {};
  HM.users = null;
  refreshMe();
  showHome();
}

const PW_EYE_OPEN = '<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/>';
const PW_EYE_OFF = '<path d="M3 3l18 18M10.6 10.6a3 3 0 0 0 4.2 4.2"/><path d="M9.9 5.2A10.6 10.6 0 0 1 12 5c6.4 0 10 7 10 7a17.6 17.6 0 0 1-4.1 4.9M6.3 6.3C3.7 8.2 2 12 2 12s3.6 7 10 7c1.9 0 3.6-.5 5-1.3"/>';
function setPwVis(show) {
  $('pass').type = show ? 'text' : 'password';
  $('pwToggle').setAttribute('aria-pressed', String(show));
  $('pwToggle').setAttribute('aria-label', show ? 'ซ่อนรหัสผ่าน' : 'แสดงรหัสผ่าน');
  $('pwIcon').innerHTML = show ? PW_EYE_OFF : PW_EYE_OPEN;
}
$('pwToggle').addEventListener('click', () => {
  setPwVis($('pass').type === 'password');
  $('pass').focus();
});

function signOutAll() {
  document.body.classList.add('locked');
  closeMenu();
  closeAcct();
  leaveHome();
  const d = dailySession();
  if (d) post(DAILY_API, { action: 'logout', token: d.token }).catch(() => {});
  ls.set('di_user', null);
  const ns = ls.json('nsp');
  if (ns && ns.user) { delete ns.user; ls.set('nsp', JSON.stringify(ns)); }
  Object.values(frames).forEach(f => f.remove());
  for (const k in frames) delete frames[k];
  setPwVis(false);
  $('pass').value = '';
  $('err').textContent = '';
  $('login').hidden = false;
  setTimeout(() => $('user').focus(), 60);
}

addEventListener('message', e => {
  if (e.origin === location.origin && e.data && e.data.type === 'shell-logout') signOutAll();
});

$('user').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); $('pass').focus(); } });
['user', 'pass'].forEach(id => $(id).addEventListener('input', () => { $('err').textContent = ''; }));
$('form').addEventListener('submit', async e => {
  e.preventDefault();
  const user = $('user').value.trim(), pass = $('pass').value;
  if (!user || !pass) {
    $('err').textContent = 'กรอกชื่อผู้ใช้และรหัสผ่าน';
    (!user ? $('user') : $('pass')).focus();
    return;
  }
  $('go').disabled = true;
  $('go').textContent = 'กำลังเข้าสู่ระบบ…';
  let j;
  try {
    j = await post(DAILY_API, { action: 'login', user: user.toLowerCase(), pass });
  } catch {
    j = { ok: false, error: 'เชื่อมต่อไม่ได้ ตรวจอินเทอร์เน็ตแล้วลองใหม่' };
  }
  $('go').disabled = false;
  $('go').textContent = 'เข้าสู่ระบบ';
  if (!j.ok) {
    $('err').textContent = j.error || 'เข้าสู่ระบบไม่ได้';
    $('pass').focus();
    $('pass').select();
    return;
  }
  setPwVis(false);
  if (ls.get('di_last_user') !== j.user) {
    ls.set('daily_inspection_records_v1', null);
    ls.set('di_sync_queue', null);
  }
  ls.set('di_last_user', j.user);
  const s = { user: j.user, name: j.name, token: j.token, admin: !!j.admin };
  ls.set('di_user', JSON.stringify(s));
  const ns = ls.json('nsp') || {};
  ns.user = s;
  ls.set('nsp', JSON.stringify(ns));
  openApps();
});

if (dailySession() || nightSession()) openApps();
else {
  document.body.classList.add('locked');
  setTimeout(() => $('user').focus(), 60);
}
</script>
