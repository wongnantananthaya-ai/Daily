<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Daily Inspection — CE97F1005Q</title>
<style>
:root{
  color-scheme:light dark;
  --bg:#F2F2F7;--card:#FFFFFF;--field:#F7F7FA;--fill:rgba(118,118,128,.12);--fill2:rgba(118,118,128,.08);
  --label:#000;--label2:rgba(60,60,67,.62);--label3:rgba(60,60,67,.3);--sep:rgba(60,60,67,.29);
  --field-b:rgba(60,60,67,.3);--tint:#007AFF;
  --green:#34C759;--green-t:#248A3D;--red:#FF3B30;--red-t:#D70015;--orange:#FF9500;--orange-t:#C93400;
  --seg-on:#FFFFFF;--mat:rgba(249,249,249,.8);--dim:rgba(0,0,0,.4);
  --shadow:0 1px 3px rgba(0,0,0,.08),0 1px 1px rgba(0,0,0,.03);
  --ok-t:#1A7431;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#000;--card:#1C1C1E;--field:#2C2C2E;--fill:rgba(118,118,128,.24);--fill2:rgba(118,118,128,.16);
  --label:#FFF;--label2:rgba(235,235,245,.62);--label3:rgba(235,235,245,.3);--sep:rgba(84,84,88,.65);
  --field-b:rgba(235,235,245,.26);--tint:#0A84FF;
  --green:#30D158;--green-t:#30D158;--red:#FF453A;--red-t:#FF6961;--orange:#FF9F0A;--orange-t:#FF9F0A;
  --seg-on:#636366;--mat:rgba(22,22,23,.8);--dim:rgba(0,0,0,.55);
  --ok-t:#4ADE80;
}}
@media (prefers-contrast:more){:root{--label2:rgba(60,60,67,.88);--sep:rgba(60,60,67,.55);--field-b:rgba(60,60,67,.6);--tint:#0040DD}}
@media (prefers-reduced-transparency:reduce){:root{--mat:var(--card)}}

html{font-size:17px;-webkit-text-size-adjust:100%}
@supports (font:-apple-system-body){html{font:-apple-system-body}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--label);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","Sukhumvit Set","Noto Sans Thai","Leelawadee UI",sans-serif;font-size:1rem;line-height:1.3;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
svg.i{width:1.1em;height:1.1em;flex:none;fill:none;stroke:currentColor;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.18em}
.shell{max-width:600px;margin:0 auto;min-height:100vh;min-height:100dvh;padding-bottom:calc(env(safe-area-inset-bottom) + 96px)}

/* nav bar + large title */
.nav{position:sticky;top:0;z-index:30;padding:env(safe-area-inset-top) 16px 0;background:var(--bg);transition:background .2s}
.nav.scrolled{background:var(--mat);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);box-shadow:0 .5px 0 var(--sep)}
.nav-row{display:flex;align-items:center;justify-content:space-between;min-height:44px}
.nav-title{font-weight:600;opacity:0;transition:opacity .2s}
.nav.scrolled .nav-title{opacity:1}
.tbtn{position:relative;border:0;background:none;color:var(--tint);min-height:44px;min-width:44px;display:inline-flex;align-items:center;justify-content:center;gap:4px;cursor:pointer;font-size:1rem}
.tbtn:active{opacity:.4}
.count{position:absolute;top:6px;right:2px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font-size:.65rem;font-weight:700;display:grid;place-items:center}
.count[data-n="0"]{display:none}
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;gap:2px;margin:8px 0 10px}
.seg button{position:relative;flex:1;border:0;background:transparent;min-height:32px;border-radius:7px;font-size:.82rem;font-weight:500;cursor:pointer;transition:background .2s}
.seg button::after{content:"";position:absolute;inset:-6px 0}
.seg button[aria-selected=true]{background:var(--seg-on);box-shadow:var(--shadow);font-weight:600}
.head{padding:0 16px}
.large{margin:4px 0 2px;font-size:2rem;font-weight:700;line-height:1.15}
.sub{margin:0 0 20px;color:var(--label2);font-size:.88rem;display:flex;align-items:center;gap:6px}
.code{font-size:.7rem;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--fill2)}

/* inset grouped */
main{padding:0 16px}
.sec{margin:0 0 22px}
.sec-h{display:flex;align-items:center;gap:8px;margin:0 4px 8px}
.sec-h h2{flex:1;margin:0;font-size:.76rem;font-weight:400;text-transform:uppercase;letter-spacing:.02em;color:var(--label2)}
.grp{background:var(--card);border-radius:12px;overflow:hidden}
.row{position:relative;display:flex;flex-wrap:wrap;align-items:center;column-gap:12px;row-gap:8px;min-height:44px;padding:10px 16px}
.row+.row::before,.grp>*+.row::before,.issue+.row::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--sep)}
.lab{flex:1 1 6rem;min-width:0}
.lab b{display:block;font-weight:400}
.lab small{display:block;margin-top:2px;font-size:.76rem;color:var(--label2)}
.lab small.spec{display:inline-block;margin-top:5px;padding:2px 8px;border-radius:6px;background:var(--fill2)}
.msg{display:none;align-items:center;gap:4px;margin-top:4px;font-size:.76rem;font-weight:500}
.row.valid .msg{display:flex;color:var(--green-t)}
.row.invalid .msg{display:flex;color:var(--red-t)}
.val{display:flex;align-items:center;gap:6px;margin-left:auto}
.inp{width:5.6em;min-height:44px;margin:-4px 0;padding:0 12px;border:1.5px solid var(--field-b);border-radius:10px;background:var(--field);text-align:right;font-weight:500;outline:none;transition:border-color .15s,box-shadow .15s}
.inp::placeholder{color:var(--label3);font-weight:400}
.inp:focus{border-color:var(--tint);background:var(--card);box-shadow:0 0 0 4px color-mix(in srgb,var(--tint) 22%,transparent)}
.inp.wide{width:9.5em}
.inp[type=date]{width:auto;text-align:left;color:var(--tint)}
select.inp{width:auto;text-align:left;appearance:none;-webkit-appearance:none;padding-right:30px;background-image:linear-gradient(45deg,transparent 50%,var(--label2) 50%),linear-gradient(-45deg,transparent 50%,var(--label2) 50%);background-position:calc(100% - 15px) 50%,calc(100% - 10px) 50%;background-size:5px 5px;background-repeat:no-repeat}
.row.valid .inp{border-color:color-mix(in srgb,var(--green) 70%,transparent)}
.row.invalid .inp{border-color:var(--red);color:var(--red-t);font-weight:600}
.row.miss .lab b{color:var(--red-t)}
.row.miss .inp{border-color:var(--red)}
#machineNo::-webkit-calendar-picker-indicator,#mNo::-webkit-calendar-picker-indicator{display:none!important}
.inp[type=number]{-moz-appearance:textfield;appearance:textfield}
.inp[type=number]::-webkit-inner-spin-button,.inp[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.unit{width:3.9em;flex:none;white-space:nowrap;font-size:.88rem;color:var(--label2)}
textarea.inp{display:block;width:calc(100% - 32px);margin:2px 16px 14px;min-height:5.5em;padding:10px 12px;text-align:left;resize:vertical}

/* machine info rows: leading icon, label, equal-width field on the right */
.row.info{min-height:58px;flex-wrap:nowrap}
.ri{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;flex:none;color:var(--mc,var(--tint));background:color-mix(in srgb,var(--mc,var(--tint)) 14%,transparent);transition:color .25s,background .25s}
.ri svg.i{width:18px;height:18px;stroke-width:1.8;--duo:color-mix(in srgb,var(--mc,var(--tint)) 24%,transparent)}
.row.info .lab{flex:1 1 auto}
.row.info .lab b{white-space:nowrap}
.field{display:flex;align-items:center;gap:6px;flex:none;width:9.6rem;min-height:44px;padding:0 12px;border:1.5px solid var(--field-b);border-radius:12px;background:var(--field);transition:border-color .15s,box-shadow .15s,background .15s}
.field:focus-within{border-color:var(--tint);background:var(--card);box-shadow:0 0 0 4px color-mix(in srgb,var(--tint) 20%,transparent)}
.field input{flex:1;min-width:0;border:0;background:transparent;outline:none;padding:0;font-weight:500;color:var(--label)}
.field input::placeholder{color:var(--label3);font-weight:400}
.field input[type=date]{color:var(--tint)}
.field .pre{font-size:.8rem;font-weight:700;color:var(--label2);letter-spacing:.02em}
.row.miss .field{border-color:var(--red)}
.row.miss .ri{color:var(--red);background:color-mix(in srgb,var(--red) 12%,transparent)}
.field.sel{position:relative;padding-right:30px;gap:8px}
.field.sel::after{content:"";position:absolute;right:13px;top:50%;width:7px;height:7px;margin-top:-6px;border-right:2px solid var(--label2);border-bottom:2px solid var(--label2);transform:rotate(45deg);pointer-events:none}
.field select{flex:1;min-width:0;border:0;background:transparent;outline:none;padding:0;min-height:42px;font-size:1rem;font-weight:500;color:var(--label);appearance:none;-webkit-appearance:none;cursor:pointer}
.field .st-dot{width:10px;height:10px;border-radius:50%;flex:none;box-shadow:0 0 0 3px color-mix(in srgb,currentColor 18%,transparent)}
@media (max-width:360px){.field{width:8.6rem}}

/* collapsible section */
.acc{background:var(--card);border-radius:12px;overflow:hidden}
.acc-h{display:flex;align-items:center;gap:10px;width:100%;min-height:56px;padding:10px 16px;border:0;background:none;text-align:left;cursor:pointer}
.acc-h:active{background:var(--fill2)}
.tile{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:none;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)}
.tile svg.i{width:19px;height:19px;stroke-width:1.8;--duo:color-mix(in srgb,var(--c) 24%,transparent)}
.tile.lg{width:46px;height:46px}
.tile.lg svg.i{width:26px;height:26px}
.mrow b{font-weight:600}
.duo{--duo:color-mix(in srgb,currentColor 22%,transparent)}
.acc-h .t{flex:1;min-width:0;font-weight:600}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:.72rem;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--fill2);color:var(--label2);white-space:nowrap}
.badge.done{background:color-mix(in srgb,var(--green) 15%,transparent);color:var(--green-t)}
.badge.warn{background:color-mix(in srgb,var(--red) 14%,transparent);color:var(--red-t)}
.chev{color:var(--label3);transition:transform .25s cubic-bezier(.32,.72,0,1)}
.acc.open .chev{transform:rotate(90deg)}
.acc-b{display:none;border-top:.5px solid var(--sep)}
.acc.open .acc-b{display:block}
.quick{display:flex;align-items:center;justify-content:center;gap:6px;width:calc(100% - 32px);margin:12px 16px 4px;min-height:44px;border:0;border-radius:10px;background:color-mix(in srgb,var(--green) 14%,transparent);color:var(--green-t);font-weight:600;font-size:.94rem;cursor:pointer}
.quick:active{opacity:.6}

/* ok / ng segmented */
.okng{display:flex;flex:none;background:var(--card);border:1px solid var(--sep);border-radius:12px;padding:3px;gap:3px}
.okng button{position:relative;border:0;background:transparent;min-height:36px;padding:0 14px;border-radius:9px;font-size:.88rem;font-weight:500;color:var(--label2);display:inline-flex;align-items:center;gap:5px;cursor:pointer;transition:background .2s,color .2s,box-shadow .2s}
.okng button::after{content:"";position:absolute;inset:-5px 0}
.okng button:not([aria-checked=true]):hover{background:var(--fill2);color:var(--label)}
.okng button .ck{display:none;stroke-width:2.6}
.okng button[aria-checked=true]{font-weight:600}
.okng button[aria-checked=true] .ck{display:inline}
.okng button[data-v="ปกติ"][aria-checked=true]{background:color-mix(in srgb,var(--green) 17%,var(--card));color:var(--ok-t);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--green) 55%,transparent)}
.okng button[data-v="ผิดปกติ"][aria-checked=true]{background:color-mix(in srgb,var(--red) 14%,var(--card));color:var(--red-t);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--red) 55%,transparent)}

/* abnormal item: note + photos */
.row.isbad,.issue{background:color-mix(in srgb,var(--red) 6%,transparent)}
.issue{padding:0 16px 14px}
.issue-h{display:flex;align-items:center;gap:5px;margin:0 0 8px;font-size:.76rem;font-weight:600;color:var(--red-t)}
.issue textarea.inp{width:100%;margin:0 0 10px;min-height:4.2em}
.issue.need textarea.inp{border-color:var(--red);box-shadow:0 0 0 4px color-mix(in srgb,var(--red) 18%,transparent)}
.photos{display:flex;flex-wrap:wrap;gap:8px}
.ph{position:relative;width:76px;height:76px;border-radius:10px;overflow:hidden;background:var(--fill)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph button{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center;cursor:pointer}
.ph button::after{content:"";position:absolute;inset:-8px}
.ph button svg.i{width:14px;height:14px;stroke-width:2.6}
.addph{width:76px;height:76px;border-radius:10px;border:1.5px dashed var(--field-b);background:var(--card);color:var(--tint);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:.68rem;font-weight:600;cursor:pointer}
.addph svg.i{width:24px;height:24px;stroke-width:1.8}
.addph:active{opacity:.6}
.issue.need .addph{border-color:var(--red)}
.sharebtn{display:inline-flex;align-items:center;gap:6px;margin-top:6px;min-height:44px;padding:0;border:0;background:none;color:var(--tint);font-weight:600;font-size:.94rem;cursor:pointer}
.sharebtn:active{opacity:.5}

/* status banner */
.banner{display:flex;gap:10px;align-items:flex-start;margin:0 0 22px;padding:12px 14px;border-radius:12px;background:color-mix(in srgb,var(--orange) 14%,transparent);color:var(--orange-t);font-size:.88rem;line-height:1.45}
.banner svg.i{margin-top:2px}
.st-dot{width:9px;height:9px;border-radius:50%;flex:none}

/* bottom bar */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--mat);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border-top:.5px solid var(--sep);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.bar-in{max-width:568px;margin:0 auto;display:flex;align-items:center;gap:8px}
.progress b,.progress small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.draftbtn{flex:none;border:0;background:color-mix(in srgb,var(--orange) 18%,var(--card));color:var(--orange-t);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--orange) 45%,transparent);border-radius:999px;min-height:50px;padding:0 14px 0 12px;font-weight:600;font-size:.94rem;display:inline-flex;align-items:center;gap:5px;cursor:pointer;transition:transform .15s}
.draftbtn:active{transform:scale(.97)}
.banner.info{background:color-mix(in srgb,var(--tint) 11%,transparent);color:var(--tint);align-items:center}
.banner .bact{flex:none;margin-left:auto;border:0;background:var(--card);color:inherit;font-weight:700;font-size:.82rem;min-height:34px;padding:0 12px;border-radius:999px;cursor:pointer}
/* history calendar */
.hseg{margin:0 0 10px}
.mchips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 12px;scrollbar-width:none}
.mchips::-webkit-scrollbar{display:none}
.mchips button{flex:none;min-height:36px;padding:0 14px;border:0;border-radius:999px;background:var(--card);color:var(--label);font-size:.88rem;font-weight:500;cursor:pointer}
.mchips button[aria-pressed=true]{background:var(--tint);color:#fff;font-weight:600}
.hcal-card{background:var(--card);border-radius:14px;padding:12px 12px 10px}
.hcal-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:0 4px 10px}
.hcal-h b{font-size:1.06rem;font-weight:700}
.hcal-h small{font-size:.76rem;color:var(--label2)}
.hcal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.hcal i{font-style:normal;text-align:center;font-size:.7rem;color:var(--label2);padding-bottom:2px}
.cd{position:relative;aspect-ratio:1;min-height:36px;border:0;border-radius:10px;background:transparent;color:var(--label3);font-size:.88rem;font-weight:500;cursor:pointer;display:grid;place-items:center}
.cd.ok{background:color-mix(in srgb,var(--green) 16%,transparent);color:var(--ok-t);font-weight:600}
.cd.ng{background:var(--red);color:#fff;font-weight:700}
.cd.st{background:var(--orange);color:#fff;font-weight:700}
.cd.today{box-shadow:inset 0 0 0 1.5px var(--label3)}
.cd.sel{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--tint)}
.cd sup{position:absolute;top:2px;right:4px;font-size:.58rem;line-height:1}
.hleg{display:flex;flex-wrap:wrap;gap:12px;margin:10px 4px 0;font-size:.72rem;color:var(--label2)}
.hleg span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.hleg .ok::before{background:color-mix(in srgb,var(--green) 35%,transparent)}.hleg .ng::before{background:var(--red)}.hleg .st::before{background:var(--orange)}.hleg .no::before{background:var(--fill)}
.hic{width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)}
.hic svg.i{width:19px;height:19px;stroke-width:1.8;--duo:color-mix(in srgb,var(--c) 24%,transparent)}
.hopen .t small.bad{color:var(--red-t);white-space:normal;margin-top:3px}
.badge.stop{background:color-mix(in srgb,var(--orange) 16%,transparent);color:var(--orange-t)}
.sheet-sec{margin:18px 4px 8px;font-size:.76rem;text-transform:uppercase;color:var(--label2)}
.hopen{flex:1;min-width:0;display:flex;align-items:center;gap:10px;border:0;background:none;text-align:left;padding:0;cursor:pointer;color:inherit}
.hdel{flex:none;border:0;background:none;color:var(--red-t);min-width:44px;min-height:44px;display:grid;place-items:center;cursor:pointer}
.progress{flex:1;min-width:0}
.progress b{display:block;font-size:.88rem;font-weight:600}
.progress small{display:block;font-size:.76rem;color:var(--label2);margin-top:1px}
.pbar{height:4px;border-radius:2px;background:var(--fill);margin-top:6px;overflow:hidden}
.pbar i{display:block;height:100%;width:0;border-radius:2px;background:var(--tint);transition:width .4s cubic-bezier(.32,.72,0,1)}
.pbar.warn i{background:var(--red)}.pbar.done i{background:var(--green)}
.save{flex:none;border:0;border-radius:999px;background:var(--tint);color:#fff;min-height:50px;padding:0 20px 0 16px;font-weight:600;display:inline-flex;align-items:center;gap:6px;cursor:pointer;box-shadow:0 4px 14px color-mix(in srgb,var(--tint) 35%,transparent);transition:transform .15s}
.save:active{transform:scale(.97)}

/* toast */
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 12px);z-index:70;display:flex;align-items:center;gap:8px;padding:12px 20px;border-radius:999px;background:var(--mat);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);box-shadow:0 8px 30px rgba(0,0,0,.15);font-size:.88rem;font-weight:600;white-space:nowrap;transform:translate(-50%,-150%);opacity:0;visibility:hidden;transition:transform .45s cubic-bezier(.32,.72,0,1),opacity .3s,visibility .45s}
.toast.show{transform:translate(-50%,0);opacity:1;visibility:visible}
.toast.ok svg.i{color:var(--green)}.toast.err svg.i{color:var(--red)}

/* sheet + alert */
.dim{position:fixed;inset:0;z-index:60;background:var(--dim);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s}
.dim.open{opacity:1;pointer-events:auto}
.sheet{width:100%;max-width:600px;max-height:88vh;max-height:88dvh;background:var(--bg);border-radius:14px 14px 0 0;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .4s cubic-bezier(.32,.72,0,1)}
.dim.open .sheet{transform:none}
.grab{width:36px;height:5px;border-radius:3px;background:var(--label3);margin:6px auto 0}
.sheet-h{display:flex;align-items:center;gap:4px;padding:2px 8px 2px 16px;min-height:52px}
.sheet-h h3{flex:1;margin:0;font-size:1rem;font-weight:600}
.sheet-b{overflow:auto;padding:4px 16px calc(env(safe-area-inset-bottom) + 24px)}
.hitem{display:flex;align-items:center;gap:12px;padding:12px 16px;position:relative}
.hitem+.hitem::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--sep)}
.hitem .t{flex:1;min-width:0}
.hitem .t b{display:block;font-weight:600}
.hitem .t small{display:block;margin-top:2px;font-size:.82rem;color:var(--label2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nodata{padding:44px 16px;text-align:center;color:var(--label2)}
.nodata svg.i{display:block;width:2.4rem;height:2.4rem;margin:0 auto 10px;color:var(--label3)}
.alert-dim{align-items:center}
.alert{width:270px;border-radius:14px;overflow:hidden;text-align:center;background:var(--mat);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);transform:scale(1.1);transition:transform .25s cubic-bezier(.32,.72,0,1)}
.dim.open .alert{transform:none}
.alert .m{padding:20px 16px}
.alert .m b{display:block;font-weight:600;margin-bottom:4px}
.alert .m span{font-size:.8rem}
.alert .a{display:flex;border-top:.5px solid var(--sep)}
.alert .a button{flex:1;border:0;background:none;min-height:44px;color:var(--tint);cursor:pointer}
.alert .a button+button{border-left:.5px solid var(--sep);font-weight:600}

/* monthly sheet (matches the paper form) */
.month{position:fixed;inset:0;z-index:55;background:var(--bg);overflow:auto;-webkit-overflow-scrolling:touch}
.month[hidden]{display:none}
.mnav{position:sticky;top:0;left:0;z-index:2;display:flex;align-items:center;gap:4px;min-height:44px;padding:env(safe-area-inset-top) 8px 0;background:var(--mat);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border-bottom:.5px solid var(--sep)}
.mnav .t{flex:1;text-align:center;font-weight:600}
.mnav .tbtn{padding:0 8px}
.mctl{max-width:600px;margin:0 auto;padding:12px 16px 0}
.mhint{max-width:600px;margin:0 auto;padding:10px 20px 12px;font-size:.76rem;color:var(--label2);display:flex;gap:6px;align-items:center}
/* locked landscape page viewer: fits the screen, no sliding; pinch / buttons / double-tap to zoom */
.viewer{position:relative;margin:0 auto;overflow:hidden;touch-action:none;background:#fff;border-radius:6px;box-shadow:0 2px 14px rgba(0,0,0,.16);cursor:zoom-in;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.viewer.zoomed{cursor:grab}
.viewer.dragging{cursor:grabbing}
.page{position:absolute;left:0;top:0;width:1123px;transform-origin:0 0;will-change:transform}
.page img{-webkit-user-drag:none;pointer-events:none}
.zoomctl{position:sticky;bottom:calc(env(safe-area-inset-bottom) + 12px);z-index:3;display:flex;align-items:center;gap:2px;width:max-content;margin:14px auto calc(env(safe-area-inset-bottom) + 20px);padding:4px;border-radius:999px;background:var(--mat);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);box-shadow:0 4px 18px rgba(0,0,0,.14)}
.zoomctl button{min-width:44px;min-height:40px;border:0;background:none;color:var(--tint);font-size:1.25rem;font-weight:600;border-radius:999px;cursor:pointer}
.zoomctl button:active{background:var(--fill)}
.zoomctl #zFit{font-size:.82rem;padding:0 14px}
.zoomctl .landbtn{display:inline-flex;align-items:center;gap:5px;font-size:.82rem;padding:0 14px;margin-left:2px;background:var(--tint);color:#fff}
.zoomctl .landbtn:active{background:var(--tint);opacity:.8}
.zoomctl span{min-width:3.6em;text-align:center;font-size:.82rem;font-weight:600;font-variant-numeric:tabular-nums;color:var(--label2)}
.paper{position:relative;width:1123px;min-height:794px;margin:0;background:#fff;color:#000;padding:26px 44px;font-family:"Sarabun","TH Sarabun New","Leelawadee UI","Noto Sans Thai",sans-serif;font-size:10.5px;color-scheme:light}
.paper table{border-collapse:collapse;width:100%;table-layout:fixed}
.paper th,.paper td{border:1px solid #000;text-align:center;vertical-align:middle;padding:2px 3px;font-weight:400;line-height:1.35;overflow-wrap:anywhere}
.paper .top{margin-bottom:-1px}
.paper .top td{height:46px}
.paper .top .ttl{font-size:20px;font-weight:600;text-align:left;padding-left:8px}
.paper .top .code{font-size:15px;font-weight:600}
.paper .top small{display:block;font-size:8px;font-weight:400;color:#555}
.paper .u{display:inline-block;min-width:110px;border-bottom:1.5px solid #000;text-align:center}
.paper thead th{font-size:9.5px}
.paper tbody td{height:54px;font-size:11px}   /* 10 rows fill one A4-landscape page like the paper form */
.paper td.insp{font-size:11.5px;line-height:1.25}
.paper td.bad{color:#D70015;font-weight:700}
.paper td.note{font-size:9.5px;text-align:left}
.paper .appx{margin-top:16px}
.paper .appx h4{margin:0 0 8px;font-size:13px;font-weight:600}
.paper .appx-g{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.paper figure{margin:0;border:1px solid #000;padding:4px;break-inside:avoid}
.paper figure img{display:block;width:100%;height:120px;object-fit:cover}
.paper figcaption{font-size:9.5px;margin-top:4px;line-height:1.35}
/* Report layout */
/* PDF page — Apple-style document: white page, system type, gray secondary labels, hairlines, tinted system colors */
.paper.rep{padding:0;display:flex;flex-direction:column;color:#1D1D1F;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","Sukhumvit Set","Noto Sans Thai","Leelawadee UI",sans-serif;-webkit-font-smoothing:antialiased}
.rp-head{display:flex;align-items:center;gap:16px;padding:24px 44px 14px}
.rp-ic{width:54px;height:54px;border-radius:50%;flex:none;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 13%,#fff)}
.rp-ic svg.i{width:30px;height:30px;stroke-width:1.7;--duo:color-mix(in srgb,var(--c) 22%,transparent)}
.rp-head .eyebrow{font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#6E6E73}
.rp-head h1{margin:2px 0 0;font-size:26px;font-weight:700;letter-spacing:-.01em;line-height:1.15}
.rp-head .sub{margin-top:3px;font-size:13px;color:#6E6E73}
.rp-head .meta{margin-left:auto;text-align:right;font-size:11px;line-height:1.6;color:#6E6E73}
.rp-head .meta b{font-weight:600;color:#1D1D1F}
.rp-kpi{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;padding:0 44px 14px}
.rp-kpi>.kpi{display:flex;align-items:center;gap:11px;padding:11px 14px;border:0;border-radius:14px;background:#F5F5F7;color:#1D1D1F;font:inherit;text-align:left;cursor:pointer;transition:box-shadow .2s,background .2s}
.rp-kpi>.kpi[aria-pressed=true]{background:color-mix(in srgb,var(--k) 9%,#fff);box-shadow:0 0 0 2px var(--k)}
.paper table.rt tr.dim td{opacity:.22}
.paper table.rt tr td{transition:opacity .25s}
/* day list under the page (not printed) */
.daylist{max-width:760px;margin:16px auto 0;padding:0 16px}
.daylist[hidden]{display:none}
.dl-h{display:flex;align-items:center;margin:0 4px 8px}
.dl-h b{flex:1;font-size:1rem;font-weight:700}
.dl-item{display:flex;align-items:flex-start;gap:12px;padding:12px 16px;position:relative}
.dl-item+.dl-item::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--sep)}
.dl-date{flex:none;min-width:3.2em;font-weight:700;font-size:1.06rem;padding-top:1px}
.dl-item .t{flex:1;min-width:0}
.dl-item .t b{display:flex;align-items:center;gap:8px;font-weight:500}
.dl-item .t small{display:block;margin-top:5px;font-size:.82rem;line-height:1.5;color:var(--label2)}
.dl-item .bad{color:var(--red-t);font-weight:600}
.dl-item .stop{color:var(--orange-t);font-weight:600}
.dl-item .chip{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.72rem;font-weight:600;white-space:nowrap}
.dl-item .chip.ok{background:color-mix(in srgb,var(--green) 16%,transparent);color:var(--ok-t)}
.dl-item .chip.ng{background:color-mix(in srgb,var(--red) 14%,transparent);color:var(--red-t)}
.dl-item .chip.st{background:color-mix(in srgb,var(--orange) 16%,transparent);color:var(--orange-t)}
.dl-cam{flex:none;display:flex;align-items:center;gap:4px;min-height:44px;padding:0 12px;border:0;border-radius:999px;background:color-mix(in srgb,var(--tint) 12%,transparent);color:var(--tint);font-weight:600;cursor:pointer}
.dl-cam svg.i{width:20px;height:20px}
.rp-kpi .ki{width:32px;height:32px;border-radius:50%;flex:none;display:grid;place-items:center;color:var(--k);background:color-mix(in srgb,var(--k) 14%,#fff)}
.rp-kpi .ki svg.i{width:18px;height:18px;stroke-width:1.9;--duo:color-mix(in srgb,var(--k) 22%,transparent)}
.rp-kpi b{display:block;font-size:21px;font-weight:700;line-height:1.1}
.rp-kpi .l{display:block;font-size:10.5px;color:#6E6E73}
.rp-body{flex:1;padding:0 38px 24px}
.paper table.rt tbody td:not(.note):not(.insp){white-space:nowrap}
/* clear column + row lines, larger readable type */
.paper table.rt{border:1.2px solid #8E8E93}
.paper table.rt th,.paper table.rt td{border:1px solid #AEAEB2}
.paper table.rt thead th{background:#F2F2F7;color:#1D1D1F;font-size:9.6px;font-weight:600;line-height:1.25;padding:5px 1px;vertical-align:middle;overflow-wrap:normal;word-break:normal;letter-spacing:-.015em}
.paper table.rt thead tr:first-child th{border-bottom-color:#D1D1D6}
.paper table.rt thead th[rowspan],.paper table.rt thead tr.spec th{border-bottom:1.2px solid #8E8E93}
.paper table.rt thead tr.spec th{font-size:9px;font-weight:500;color:#48484A;padding:4px 2px}
.paper table.rt tbody td{height:47px;color:#1D1D1F;font-size:13px;font-weight:500;padding:0 2px}
.paper table.rt tbody tr:nth-child(even) td{background:#FAFAFC}
.paper table.rt td.bad{background:#FFE9E7!important;color:#D70015;font-weight:700}
.paper table.rt td.dt{font-weight:700}
.paper table.rt td.insp{font-size:12.5px;color:#1D1D1F}
.paper table.rt td.note{font-size:11px;font-weight:400;color:#3A3A3C;line-height:1.35}
.paper .chip{font-size:11px!important}
.paper .chip{display:inline-block;padding:3px 9px;border-radius:999px;font-size:10px;font-weight:600;white-space:nowrap}
.paper .chip.ok{background:#E8F7EC;color:#248A3D}.paper .chip.ng{background:#FFECEB;color:#D70015}
.rp-foot{display:flex;align-items:flex-end;gap:32px;padding:8px 44px 20px;font-size:10px;color:#8E8E93}
.rp-foot .lg{flex:1}
.rp-foot .sig{width:170px;text-align:center}
.rp-foot .sig i{display:block;height:24px;border-bottom:1px solid #C7C7CC;margin-bottom:5px}
.camfloat{position:absolute;width:30px;height:30px;padding:0;border:0;border-radius:50%;background:#E8F1FF;color:#0A5BD3;display:grid;place-items:center;cursor:pointer;box-shadow:0 1px 3px rgba(10,91,211,.25)}

.cambtn{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;width:100%;min-height:44px;border:0;border-radius:8px;background:#E8F1FF;color:#0A5BD3;font:inherit;font-size:9.5px;font-weight:700;cursor:pointer}

.ls{position:fixed;inset:0;z-index:64;background:#1C1C1E;touch-action:none;overflow:hidden;user-select:none;-webkit-user-select:none}

.ls-stage{position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden}
.ls-page{position:absolute;left:0;top:0;transform-origin:0 0}
.ls-sheet{width:1060px;min-height:0!important;padding:0!important;border-radius:6px;overflow:hidden;box-shadow:0 6px 30px rgba(0,0,0,.45)}
.ls-sheet table.rt{border:0}
.ls-sheet table.rt tbody td{height:var(--rowh,46px)!important}

.ls-sheet .dtcam svg.i{width:15px;height:15px;stroke-width:2;--duo:rgba(10,91,211,.2)}
.ls-empty{padding:40px 60px;background:#fff;border-radius:12px;font-size:16px;color:#3A3A3C}
.ls-hint.gone{opacity:0}
.ls-page img{pointer-events:none}
.ls-close{position:absolute;top:calc(env(safe-area-inset-top) + 10px);right:12px;z-index:2;min-height:40px;padding:0 16px;border:0;border-radius:999px;background:rgba(0,0,0,.62);color:#fff;font:inherit;font-weight:600;font-size:.9rem;cursor:pointer;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.ls-hint{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);padding:6px 14px;border-radius:999px;background:rgba(0,0,0,.55);color:#fff;font-size:.76rem;white-space:nowrap;pointer-events:none;transition:opacity .4s}
.ls.zoomed .ls-hint{opacity:0}

.lb{position:fixed;inset:0;z-index:66;background:#000;color:#fff;display:flex;flex-direction:column}
.lb[hidden]{display:none}
.lb-top{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 6px) 8px 6px 16px}
.lb-top>div{flex:1;min-width:0}

.lb-top small{display:block;font-size:.76rem;color:rgba(255,255,255,.65)}
.lb-top .tbtn{color:#5AC8FA;font-weight:600;padding:0 10px}
.lb-track{flex:1;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior:contain}
.lb-track::-webkit-scrollbar{display:none}
.lb-slide{flex:0 0 100%;scroll-snap-align:center;margin:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:8px 16px calc(env(safe-area-inset-bottom) + 20px)}
.lb-slide img{max-width:100%;max-height:calc(100dvh - 190px);object-fit:contain;border-radius:8px}
.lb-slide figcaption{max-width:640px;text-align:center;font-size:.88rem;line-height:1.45}
.lb-slide figcaption b{display:block}
.lb-slide figcaption span{color:rgba(255,255,255,.75)}
.lb-nav{position:absolute;top:50%;width:44px;height:44px;margin-top:-22px;border:0;border-radius:50%;background:rgba(255,255,255,.16);color:#fff;display:grid;place-items:center;cursor:pointer;backdrop-filter:blur(10px)}
.lb-nav svg.i{width:22px;height:22px;stroke-width:2.4}
.lb-nav.prev{left:10px}.lb-nav.next{right:10px}
.lb-nav[hidden]{display:none}
@media (hover:none){.lb-nav{display:none}}
.mbtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;border:0;border-radius:12px;background:var(--card);color:var(--tint);font-weight:600;margin:0 0 16px;cursor:pointer}
.mbtn:active{opacity:.6}
@media print{
  @page{size:A4 landscape;margin:7mm}
  html,body{background:#fff!important;overflow:visible!important}
  .shell,.bar,.toast,.dim{display:none!important}
  .month{position:static;overflow:visible;background:#fff}
  .mnav,.mctl,.mhint{display:none!important}
  .viewer{height:auto!important;width:auto!important;overflow:visible;box-shadow:none;border-radius:0;margin:0}
  .page{position:static;transform:none!important;width:auto}
  .zoomctl,.lb,.ls{display:none!important}
  .camfloat,.daylist{display:none!important}
  .paper table.rt tr.dim td{opacity:1!important}
  .rp-kpi>.kpi{box-shadow:none!important;background:#F5F5F7!important}
  .paper{min-width:0;min-height:0;width:100%;padding:0;box-shadow:none;border-radius:0}
  .paper tbody td{height:14.2mm}
  .paper table.rt tbody td{height:11.4mm}
  .paper.rep{min-height:0}
  .paper tr{break-inside:avoid}
  .paper .appx{break-before:page;margin-top:0}
  .paper figure img{height:42mm}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

:focus-visible{outline:3px solid color-mix(in srgb,var(--tint) 55%,transparent);outline-offset:2px;border-radius:8px}
.inp:focus-visible{outline:none}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important}}

<script>
const FORMS = {
  ACP: { name: 'Air Compressor', sections: [
    { id: 'acp_pressure', title: 'ความดัน & ชั่วโมงเดินเครื่อง', icon: 'gauge', color: '#007AFF', type: 'numeric', defaultOpen: true, fields: [
      { id: 'oil_pressure', label: 'Oil Pressure', spec: 'ระหว่าง 2.0 – 3.0', unit: 'kg/cm²', min: 2.0, max: 3.0 },
      { id: 'discha1_press', label: '1st Discha. Pressure', spec: 'ไม่ต่ำกว่า 1.5', unit: 'kg/cm²', min: 1.5 },
      { id: 'discha2_press', label: '2nd Discha. Pressure', spec: 'ไม่เกิน 6.90', unit: 'kg/cm²', max: 6.90 },
      { id: 'suction1_press', label: '1st Suction Pressure', spec: 'ไม่ต่ำกว่า -45', unit: 'kg/cm²', min: -45 },
      { id: 'motor_current', label: 'Motor current', spec: 'ค่ากระแสไฟฟ้า', unit: 'A' },
      { id: 'running_hr', label: 'Running hr', spec: 'ชั่วโมงสะสม', unit: 'Hour', min: 0 } ] },
    { id: 'acp_temp', title: 'อุณหภูมิ', icon: 'thermo', color: '#FF9500', type: 'numeric', fields: [
      { id: 'oil_temp', label: 'Oil Temp', spec: 'น้อยกว่า 60', unit: '°C', max: 60, strict: true },
      { id: 'discha1_temp', label: '1st Discha. Temp', spec: 'ไม่เกิน 180', unit: '°C', max: 180 },
      { id: 'suction2_temp', label: '2nd Suction Temp', spec: 'ไม่เกิน 55', unit: '°C', max: 55 },
      { id: 'discha2_temp', label: '2nd Discha. Temp', spec: 'ไม่เกิน 180', unit: '°C', max: 180 },
      { id: 'suction1_temp', label: '1st Suction Temp', spec: 'ไม่เกิน 55', unit: '°C', max: 55 } ] },
    { id: 'acp_water', title: 'ระบบน้ำหล่อเย็น', icon: 'drop', color: '#30B0C7', type: 'numeric', fields: [
      { id: 'water_in_temp', label: 'Water inlet Temp', spec: 'ไม่เกิน 40', unit: '°C', max: 40 },
      { id: 'water_out_temp', label: 'Water Outlet Temp', spec: 'ไม่เกิน 45', unit: '°C', max: 45 },
      { id: 'water_in_press', label: 'Water inlet Pressure', spec: 'ไม่ต่ำกว่า 0.8', unit: 'kg/cm²', min: 0.8 },
      { id: 'water_out_press', label: 'Water Outlet Pressure', spec: 'ไม่ต่ำกว่า 0.3', unit: 'kg/cm²', min: 0.3 } ] },
    { id: 'acp_visual', title: 'เช็คสภาพ & วาล์ว', icon: 'list', color: '#34C759', type: 'checklist', fields: [
      { id: 'drain_valve', label: 'Drain Solenoid valve', spec: 'การทำงานปกติ' },
      { id: 'oil_level', label: 'Lubricate oil level', spec: 'ระดับน้ำมันอยู่ช่วง H–L' },
      { id: 'way3_valve', label: '3 Way Solenoid valve', spec: 'ไม่มีน้ำซึม' },
      { id: 'general_check', label: 'เช็คสภาพทั่วไป', spec: 'ภาพรวมตัวเครื่อง' } ] },
    { id: 'acp_meta', title: 'หมายเหตุ', icon: 'doc', color: '#8E8E93', type: 'meta' } ] },
  AD: { name: 'Air Dryer', sections: [
    { id: 'ad_numeric', title: 'ค่าวัด Pressure & Dew Point', icon: 'gauge', color: '#007AFF', type: 'numeric', defaultOpen: true, fields: [
      { id: 'dew_point', label: 'Dew Point', spec: 'ไม่เกิน 10 °C', unit: '°C', max: 10 },
      { id: 'low_press', label: 'Low Pressure', spec: '0.35 – 0.6', unit: 'MPa', min: 0.35, max: 0.6 },
      { id: 'high_press', label: 'High Pressure', spec: '1.1 – 1.9', unit: 'MPa', min: 1.1, max: 1.9 } ] },
    { id: 'ad_visual', title: 'เช็คสภาพเครื่อง', icon: 'list', color: '#34C759', type: 'checklist', defaultOpen: true, fields: [
      { id: 'comp_noise', label: 'Compressor noise', spec: 'เสียงการทำงาน' },
      { id: 'running_lamp', label: 'Running Lamp', spec: 'ไฟแสดงสถานะ' },
      { id: 'drain_test', label: 'Drain test', spec: 'การระบายน้ำทิ้ง' } ] },
    { id: 'ad_meta', title: 'ผลการวิเคราะห์ & หมายเหตุ', icon: 'doc', color: '#8E8E93', type: 'meta', hasAnalysis: true } ] },
  CT: { name: 'Cooling Tower', sections: [
    { id: 'ct_numeric', title: 'ค่าวัด Temp & Water', icon: 'thermo', color: '#FF9500', type: 'numeric', defaultOpen: true, fields: [
      { id: 'ct_water_temp', label: 'Water inlet Temp', spec: 'ไม่เกิน 40 °C', unit: '°C', max: 40 },
      { id: 'iw_value', label: 'ค่าน้ำ IW', spec: '200 – 400', unit: 'µS/cm', min: 200, max: 400 } ] },
    { id: 'ct_visual', title: 'เช็คสภาพรอบเครื่อง', icon: 'list', color: '#34C759', type: 'checklist', defaultOpen: true, fields: [
      { id: 'ct_scale', label: 'Scale in cooling tower', spec: 'สะอาดและไม่มีตะกรัน' },
      { id: 'ct_overflow', label: 'เช็คระดับน้ำ', spec: 'ต่ำกว่า Overflow (0.5–1 cm)' },
      { id: 'ct_spray', label: 'Water spray', spec: 'ทุกรูของ Sprinkler pipe ต้องมีน้ำออกมา' },
      { id: 'ct_head', label: 'Sprinkler head', spec: 'ไม่รั่ว ไม่หลวม' },
      { id: 'ct_moving', label: 'Moving of sprinkler', spec: 'หมุนปกติ' },
      { id: 'ct_around', label: 'Around cooling tower', spec: 'รอบ ๆ Cooling ต้องไม่มีรอยแตก' },
      { id: 'ct_tray', label: 'Water tray', spec: 'ไม่มีน้ำเลอะรอบ ๆ ถาด' },
      { id: 'ct_louver', label: 'Inlet louver', spec: 'ไม่แตกและไม่หลวม' },
      { id: 'ct_pvc', label: 'PVC filling', spec: 'สะอาด ไม่แตก ไม่หลวม' },
      { id: 'ct_tank', label: 'Water level in Underground Tank', spec: 'ระดับน้ำต้องสัมผัสกับลูกลอย' } ] },
    { id: 'ct_meta', title: 'ผลการวิเคราะห์ & หมายเหตุ', icon: 'doc', color: '#8E8E93', type: 'meta', hasAnalysis: true } ] },
};

const STORAGE_KEY = 'daily_inspection_records_v1';
const MACHINE_COLOR = { ACP: '#5856D6', AD: '#30B0C7', CT: '#32ADE6' };
/* machine number is typed freely: "1", "no.1", "NO. 1" are all stored/compared as "1" */
const normNo = s => String(s ?? '').trim().replace(/^no\.?\s*/i, '').toUpperCase();
function rememberNo() { try { localStorage.setItem('di_no_' + currentType, normNo($('machineNo').value)); } catch {} }
function recallNo() { try { $('machineNo').value = localStorage.getItem('di_no_' + currentType) || ''; } catch { $('machineNo').value = ''; } }
function fillNoList() {
  const nos = [...new Set(store.get().map(r => normNo(r.machineNo)).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'th', { numeric: true }));
  $('noList').innerHTML = nos.map(n => `<option value="${esc(n)}">`).join('');
}
const $ = id => document.getElementById(id);
const icon = (n, cls = '') => `<svg class="i ${cls}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const haptic = p => { try { navigator.vibrate && navigator.vibrate(p); } catch {} };
const localToday = () => { const d = new Date(); return new Date(d - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); };
const store = {
  get() { try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); } catch { return []; } },
  set(v) { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(v)); return true; } catch { return false; } },
};

let currentType = 'ACP';
try { currentType = localStorage.getItem('di_type') || 'ACP'; } catch {}
if (!FORMS[currentType]) currentType = 'ACP';
let formValues = {}, openAccordions = {}, tried = false;
const draftInspector = (() => { try { return localStorage.getItem('di_inspector') || ''; } catch { return ''; } })();

$('inspectDate').value = localToday();

function validateNumeric(f, raw) {
  if (raw === '' || raw == null || Number.isNaN(parseFloat(raw))) return 'empty';
  const v = parseFloat(raw);
  if (f.min !== undefined && v < f.min) return 'invalid';
  if (f.max !== undefined && (f.strict ? v >= f.max : v > f.max)) return 'invalid';
  return (f.min !== undefined || f.max !== undefined) ? 'valid' : 'filled';
}
const isStopped = () => $('machineStatus').value === 'M/C Stop';

function initOpenState(type) {
  openAccordions = {};
  FORMS[type].sections.forEach(s => { openAccordions[s.id] = !!s.defaultOpen; });
}
function stats(sec) {
  let filled = 0, issues = 0;
  (sec.fields || []).forEach(f => {
    const v = formValues[f.id];
    if (sec.type === 'numeric') { const s = validateNumeric(f, v); if (s !== 'empty') filled++; if (s === 'invalid') issues++; }
    else { if (v) filled++; if (v === 'ผิดปกติ') issues++; }
  });
  return { filled, issues, total: (sec.fields || []).length };
}
function badge(sec) {
  if (sec.type === 'meta') return (formValues.remark || '').trim() ? { t: `${icon('check')}มีหมายเหตุ`, c: 'done' } : { t: 'ไม่บังคับ', c: '' };
  const { filled, issues, total } = stats(sec);
  if (issues) return { t: `${icon('warn')}ผิดปกติ ${issues}`, c: 'warn' };
  if (filled === total) return { t: `${icon('check')}${filled}/${total}`, c: 'done' };
  return { t: `${filled}/${total}`, c: '' };
}

function renderForm() {
  const schema = FORMS[currentType];
  document.querySelectorAll('#typeSeg button').forEach(b => b.setAttribute('aria-selected', b.dataset.type === currentType));
  $('navTitle').textContent = schema.name; $('machineName').textContent = schema.name;
  $('machineTile').style.setProperty('--c', MACHINE_COLOR[currentType]);
  document.documentElement.style.setProperty('--mc', MACHINE_COLOR[currentType]);   // row icons follow the machine's color
  $('machineTile').innerHTML = icon(currentType.toLowerCase());
  let html = draftBanner() + (isStopped() ? `<div class="banner" role="note">${icon('warn')}<span>เครื่องอยู่ในสถานะ <b>M/C Stop</b> ข้ามช่องที่ต้องวัดขณะเดินเครื่องได้ แล้วกดบันทึกได้เลย</span></div>` : '');
  schema.sections.forEach(sec => {
    const b = badge(sec), open = !!openAccordions[sec.id];
    html += `<div class="sec"><div class="acc ${open ? 'open' : ''}" data-sec="${sec.id}">
      <button class="acc-h" type="button" data-toggle="${sec.id}" aria-expanded="${open}" aria-controls="b_${sec.id}">
        <span class="tile" style="--c:${sec.color}">${icon(sec.icon)}</span>
        <span class="t">${sec.title}</span><span class="badge ${b.c}">${b.t}</span>${icon('chev', 'chev')}
      </button>
      <div class="acc-b" id="b_${sec.id}">${renderSectionBody(sec)}</div></div></div>`;
  });
  $('formContainer').innerHTML = html;
  updateOverallProgress();
}

function renderSectionBody(sec) {
  if (sec.type === 'numeric') return sec.fields.map(f => {
    const v = formValues[f.id] ?? '', s = validateNumeric(f, v);
    return `<label class="row ${s} ${s === 'invalid' ? 'isbad' : ''} ${tried && s === 'empty' && !isStopped() ? 'miss' : ''}" id="row_${f.id}">
      <span class="lab"><b>${f.label}</b><small class="spec">เกณฑ์: ${f.spec}</small>
        <span class="msg">${s === 'invalid' ? icon('warn') + 'ค่าเกินเกณฑ์' : icon('checkc') + 'อยู่ในเกณฑ์'}</span></span>

/* history as a calendar: month chips → colored calendar → records of the tapped day */
const H = { month: '', day: '', type: 'all' };
const recStatus = r => isBadRec(r) ? 'ng' : (r.status && r.status !== 'Running' ? 'st' : 'ok');
const RANK = { ok: 1, st: 2, ng: 3 };
function historyCalendar(all) {
  const recs = all.filter(r => r.date && (H.type === 'all' || r.type === H.type));
  const months = [...new Set([...all.map(r => (r.date || '').slice(0, 7)).filter(Boolean), localToday().slice(0, 7)])].sort();
  if (!months.includes(H.month)) H.month = (all.map(r => r.date).sort().pop() || localToday()).slice(0, 7);
  const inMonth = recs.filter(r => r.date.startsWith(H.month));
  const byDay = {}; inMonth.forEach(r => (byDay[r.date] ||= []).push(r));
  if (!H.day || !H.day.startsWith(H.month)) H.day = Object.keys(byDay).sort().pop() || (localToday().startsWith(H.month) ? localToday() : H.month + '-01');
  const [yy, mm] = H.month.split('-').map(Number), first = new Date(yy, mm - 1, 1), days = new Date(yy, mm, 0).getDate();
  const label = (m, o) => new Date(+m.slice(0, 4), +m.slice(5, 7) - 1, 1).toLocaleDateString('th-TH', o);
  const nDays = Object.keys(byDay).length, nBad = Object.values(byDay).filter(l => l.some(r => recStatus(r) === 'ng')).length,
        nStop = Object.values(byDay).filter(l => l.some(r => recStatus(r) === 'st')).length;
  let cal = ['อา', 'จ', 'อ', 'พ', 'พฤ', 'ศ', 'ส'].map(d => `<i>${d}</i>`).join('') + '<span></span>'.repeat(first.getDay());
  for (let d = 1; d <= days; d++) {
    const key = `${H.month}-${String(d).padStart(2, '0')}`, list = byDay[key] || [];
    const st = list.reduce((w, r) => RANK[recStatus(r)] > RANK[w] ? recStatus(r) : w, list.length ? 'ok' : '');
    const name = { ok: 'ปกติ', ng: 'ผิดปกติ', st: 'M/C Stop' }[st] || 'ไม่มีบันทึก';
    cal += `<button type="button" class="cd ${st} ${key === H.day ? 'sel' : ''} ${key === localToday() ? 'today' : ''}" data-hd="${key}" aria-label="${d} ${name}${list.length > 1 ? ` ${list.length} รายการ` : ''}">${d}${list.length > 1 ? `<sup>${list.length}</sup>` : ''}</button>`;
  }
  const dayRecs = (byDay[H.day] || []).slice().sort((a, b) => a.type.localeCompare(b.type) || a.machineNo.localeCompare(b.machineNo));
  const dayTitle = new Date(+H.day.slice(0, 4), +H.day.slice(5, 7) - 1, +H.day.slice(8, 10)).toLocaleDateString('th-TH', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  const typeSeg = [['all', 'ทั้งหมด'], ['ACP', 'Compressor'], ['AD', 'Dryer'], ['CT', 'Cooling']]
    .map(([k, l]) => `<button type="button" role="tab" data-htype="${k}" aria-selected="${H.type === k}">${l}</button>`).join('');
  return `<div class="sheet-sec">บันทึกแล้ว</div>
    <div class="seg hseg" role="tablist" aria-label="เครื่อง">${typeSeg}</div>
    <div class="mchips" id="mchips">${months.map(m => `<button type="button" data-hm="${m}" aria-pressed="${m === H.month}">${label(m, { month: 'short', year: '2-digit' })}</button>`).join('')}</div>
    <div class="hcal-card">
      <div class="hcal-h"><b>${label(H.month, { month: 'long', year: 'numeric' })}</b><small>${nDays} วัน · ผิดปกติ ${nBad} · Stop ${nStop}</small></div>
      <div class="hcal">${cal}</div>
      <div class="hleg"><span class="ok">ปกติ</span><span class="ng">ผิดปกติ</span><span class="st">M/C Stop</span><span class="no">ไม่มีบันทึก</span></div>
    </div>
    <div class="sheet-sec">${dayTitle} · แตะเพื่อแก้ไข</div>
    ${dayRecs.length ? `<div class="grp">${dayRecs.map(r => {
      const s = recStatus(r), lines = abnormalIds(r.type, r.data).map(id => {
        const fm = fieldOf(r.type, id), note = r.data.issues?.[id]?.note;
        return `${esc(fm.f.label)}${fm.kind === 'numeric' ? ` ${esc(r.data[id])} ${fm.f.unit}` : ''}${note ? ' — ' + esc(note) : ''}`;
      });
      return `<div class="hitem"><button type="button" class="hopen" data-edit-rec="${r.id}">
        <span class="hic" style="--c:${MACHINE_COLOR[r.type]}">${icon(r.type.toLowerCase())}</span>
        <span class="t"><b>${esc(FORMS[r.type].name)} · NO. ${esc(normNo(r.machineNo))}</b>
          <small>${esc(r.data.inspector || '-')}${r.status !== 'Running' ? ' · ' + esc(r.status) : ''}${r.data.remark ? ' · ' + esc(r.data.remark) : ''}</small>
          ${lines.length ? `<small class="bad">${lines.join('<br>')}</small>` : ''}</span>
        <span class="badge ${s === 'ng' ? 'warn' : s === 'st' ? 'stop' : 'done'}">${s === 'ng' ? icon('warn') + 'ผิดปกติ' : s === 'st' ? 'Stop' : icon('check') + 'ปกติ'}</span>${icon('chev', 'chev')}</button></div>`;
    }).join('')}</div>` : `<div class="nodata" style="padding:24px 16px">ไม่มีบันทึกในวันนี้</div>`}`;
}

function fieldOf(type, id) {

function recIssues(r) {

  FORMS[r.type].sections.forEach(s => (s.fields || []).forEach(f => {
    const v = r.data[f.id]; if (s.type === 'numeric' ? validateNumeric(f, v) === 'invalid' : v === 'ผิดปกติ') n++;
  }));

}

  if (m.kind === 'numeric') return `<td class="${validateNumeric(m.f, v) === 'invalid' ? 'bad' : ''}"${String(v).length >= 6 ? ' style="font-size:11px;letter-spacing:-.02em"' : ''}>${esc(v)}</td>`;   // long numbers (Running hr) shrink to fit
  return v === 'ผิดปกติ' ? '<td class="bad">✗</td>' : '<td>✓</td>';
}

/* tap a summary box to see which days were normal / abnormal / stopped */
function recResult(r) {
  const key = SHEET[r.type].pair[1];
  return r.data[key] || (recIssues(r) ? 'ผิดปกติ' : key === 'analysis' ? 'ปกติ' : '');
}
const isBadRec = r => recResult(r) === 'ผิดปกติ' || recIssues(r) > 0;
const FILTERS = {
  all: { t: 'วันที่บันทึกทั้งหมด', m: () => true },
  ok: { t: 'วันที่ปกติ', m: r => !isBadRec(r) },
  ng: { t: 'วันที่ผิดปกติ', m: isBadRec },
  stop: { t: 'วันที่ M/C Stop / Unload', m: r => r.status && r.status !== 'Running' },
};
function setFilter(f) { mState.filter = mState.filter === f ? null : f; applyFilter(true); haptic(5); }
function applyFilter(scroll) {
  const f = FILTERS[mState.filter], recs = SHEET_RECS;
  document.querySelectorAll('#paper .kpi').forEach(b => b.setAttribute('aria-pressed', b.dataset.kpi === mState.filter));
  document.querySelectorAll('#paper tr[data-rid]').forEach(tr => {

  if (!f) { $('dayList').hidden = true; return; }

  $('dlItems').innerHTML = list.length ? list.map(r => {
    const [, m, d] = r.date.split('-'), bad = isBadRec(r), n = recPhotos(r).length;

    });

      <span class="t"><b>${bad ? '<span class="chip ng">✗ ผิดปกติ</span>' : r.status && r.status !== 'Running' ? `<span class="chip st">⏻ ${esc(r.status)}</span>` : '<span class="chip ok">✓ ปกติ</span>'} ${esc(r.data.inspector || '-')}</b>

/* ---- full-screen landscape viewer ----
   Android: real fullscreen + orientation lock. Elsewhere (iPhone, or lock refused): if the screen is portrait,
   the stage is rotated 90° in CSS so the A4-landscape page fills the phone's long side; turn the phone to read it. */
const LS = { zoom: 1, tx: 0, ty: 0, fit: 1, SW: 0, SH: 0, ph: 794, pw: 1060, rot: false };
/* landscape shows only the table rows that were filled in (no title, no summary, no blank rows) */
function buildLandscapeTable() {
  const src = $('paper').querySelector('table.rt');
  const rows = src ? [...src.tBodies[0].rows].filter(tr => tr.dataset.rid) : [];
  if (!rows.length) return `<div class="ls-empty">ยังไม่มีข้อมูลที่กรอกในเดือนนี้</div>`;
  const body = rows.map(tr => {
    const c = tr.cloneNode(true); c.classList.remove('dim');
    const r = SHEET_RECS.find(x => String(x.id) === tr.dataset.rid);
    if (r && recPhotos(r).length) c.cells[0].insertAdjacentHTML('beforeend', `<button type="button" class="dtcam" data-photos="${r.id}" aria-label="ดูภาพที่แนบ">${icon('camera')}</button>`);
    return c.outerHTML;
  }).join('');
  return `<div class="paper rep ls-sheet">${`<table class="rt">${src.querySelector('colgroup').outerHTML}${src.tHead.outerHTML}<tbody>${body}</tbody></table>`}</div>`;
}

  $('lsHint').classList.remove('gone'); clearTimeout(openLandscape.t); openLandscape.t = setTimeout(() => $('lsHint').classList.add('gone'), 2500);
  lsLayout(true);

}
function lsLayout(reset) {

}
function lsApply() {

(() => {
  const el = $('ls'), pts = new Map(); let pinch = null, lastTap = null, moved = 0;

  });

    const cam = document.elementFromPoint(e.clientX, e.clientY)?.closest('[data-photos]') ||
      [...$('lsPage').querySelectorAll('[data-photos]')].find(b => { const r = b.getBoundingClientRect();
        return Math.hypot(Math.max(r.left - e.clientX, 0, e.clientX - r.right), Math.max(r.top - e.clientY, 0, e.clientY - r.bottom)) <= 16; });

$('dlItems').addEventListener('click', e => { const b = e.target.closest('[data-photos]'); if (b) openPhotos(+b.dataset.photos); });
/* camera icon floats just outside the table's right edge, next to each day that has attached photos */
function placeCams(recs) {

  if (!tbl || $('monthView').hidden) return;
  const pr = paper.getBoundingClientRect(), k = pr.width / PAGE_W || 1;   // undo the current zoom/fit scale
  const left = (tbl.getBoundingClientRect().right - pr.left) / k + 4;
  paper.querySelectorAll('tr[data-rid]').forEach(tr => {
    const r = recs.find(x => String(x.id) === tr.dataset.rid), n = r ? recPhotos(r).length : 0; if (!n) return;
    const tb = tr.getBoundingClientRect(), [, m, d] = r.date.split('-');
    paper.insertAdjacentHTML('beforeend', `<button type="button" class="camfloat" data-photos="${r.id}" aria-label="ดูภาพที่แนบ วันที่ ${+d}/${+m} (${n})"
      style="left:${left}px;top:${(tb.top - pr.top) / k + (tb.height / k) / 2 - 15}px">${icon('camera')}</button>`);
  });
}

/* photos of one day, opened from the camera button at the end of its row */
let SHEET_RECS = [];
function recPhotos(r) {
  return Object.entries(r.data.issues || {}).flatMap(([id, it]) =>
    (it.photos || []).map(p => ({ p, label: fieldOf(r.type, id)?.f.label || id, note: it.note || '' })));
}
let lbLastFocus = null;
function openPhotos(recId) {
  const r = SHEET_RECS.find(x => x.id === recId); if (!r) return;
  const pics = recPhotos(r); if (!pics.length) return;
  $('lbTitle').textContent = `${FORMS[r.type].name} NO.${normNo(r.machineNo)} · ${thDate(r.date)}`;
  $('lbTrack').innerHTML = pics.map((x, i) => `<figure class="lb-slide"><img src="${x.p}" alt="รูปที่ ${i + 1}: ${esc(x.label)}">
    <figcaption><b>${esc(x.label)}</b>${x.note ? `<span>${esc(x.note)}</span>` : ''}</figcaption></figure>`).join('');
  $('lbTrack').scrollLeft = 0; lbCount();
  $('lb').hidden = false; lbLastFocus = document.activeElement; $('lbClose').focus(); haptic(5);
}
function lbCount() {
  const t = $('lbTrack'), n = t.children.length, i = Math.round(t.scrollLeft / Math.max(1, t.clientWidth));
  $('lbCount').textContent = n > 1 ? `${i + 1} / ${n}` : '';

}
function lbGo(d) { const t = $('lbTrack'); t.scrollBy({ left: d * t.clientWidth, behavior: 'smooth' }); }
function closePhotos() { $('lb').hidden = true; lbLastFocus?.focus?.(); }
$('lbTrack').addEventListener('scroll', () => { clearTimeout(lbCount.t); lbCount.t = setTimeout(lbCount, 60); });
$('lbClose').addEventListener('click', closePhotos);
$('lbPrev').addEventListener('click', () => lbGo(-1));
$('lbNext').addEventListener('click', () => lbGo(1));
$('lb').addEventListener('click', e => { if (e.target.id === 'lb' || e.target.classList.contains('lb-slide')) closePhotos(); });
document.addEventListener('keydown', e => {
  if ($('lb').hidden) return;
  if (e.key === 'Escape') { e.stopImmediatePropagation(); closePhotos(); }
  if (e.key === 'ArrowRight') lbGo(1);
  if (e.key === 'ArrowLeft') lbGo(-1);
}, true);
$('paper').addEventListener('click', e => {   // keyboard / no-capture clicks
  const b = e.target.closest('[data-photos]'); if (b) { openPhotos(+b.dataset.photos); return; }
  const k = e.target.closest('[data-kpi]'); if (k && e.detail === 0) setFilter(k.dataset.kpi);   // detail 0 = keyboard; pointer taps are handled by the viewer
});

/* ---- page viewer: fit whole A4-landscape page on screen, zoom 100–500%, pan only while zoomed ---- */
const PAGE_W = 1123;   // A4 landscape at 96 dpi (297 mm)
const VZ = { zoom: 1, tx: 0, ty: 0, fit: 1, W: 0, H: 0 };
function layoutViewer(reset) {
  if ($('monthView').hidden) return;
  const v = $('viewer'), ph = $('paper').offsetHeight || 794;
  const maxW = Math.min($('monthView').clientWidth - 32, 1400), maxH = Math.max(220, window.innerHeight - 120);
  VZ.fit = Math.min(maxW / PAGE_W, maxH / ph);
  VZ.W = Math.round(PAGE_W * VZ.fit); VZ.H = Math.round(ph * VZ.fit);
  v.style.width = VZ.W + 'px'; v.style.height = VZ.H + 'px';
  if (reset) { VZ.zoom = 1; VZ.tx = 0; VZ.ty = 0; }
  applyZoom();
  placeCams(SHEET_RECS);
}
function applyZoom() {
  const pw = VZ.W * VZ.zoom, ph = VZ.H * VZ.zoom;
  VZ.tx = Math.min(0, Math.max(VZ.W - pw, VZ.tx)); VZ.ty = Math.min(0, Math.max(VZ.H - ph, VZ.ty));   // keep page covering the frame
  $('page').style.transform = `translate(${VZ.tx}px,${VZ.ty}px) scale(${VZ.fit * VZ.zoom})`;
  $('zLabel').textContent = Math.round(VZ.zoom * 100) + '%';
  $('viewer').classList.toggle('zoomed', VZ.zoom > 1.001);
}
function zoomAt(z, cx = VZ.W / 2, cy = VZ.H / 2) {
  z = Math.min(5, Math.max(1, z)); const k = z / VZ.zoom;
  VZ.tx = cx - (cx - VZ.tx) * k; VZ.ty = cy - (cy - VZ.ty) * k; VZ.zoom = z; applyZoom();
}
(() => {
  const v = $('viewer'), pts = new Map(); let pinch = null, lastTap = null, moved = 0;
  const rel = (x, y) => { const r = v.getBoundingClientRect(); return { x: x - r.left, y: y - r.top }; };
  const pinchInfo = () => { const [a, b] = [...pts.values()], m = rel((a.x + b.x) / 2, (a.y + b.y) / 2); return { d: Math.hypot(a.x - b.x, a.y - b.y), ...m }; };

    v.setPointerCapture(e.pointerId); pts.set(e.pointerId, { x: e.clientX, y: e.clientY }); moved = 0;

        [...$('paper').querySelectorAll('[data-photos]')].find(b => { const r = b.getBoundingClientRect();
          return Math.hypot(Math.max(r.left - e.clientX, 0, e.clientX - r.right), Math.max(r.top - e.clientY, 0, e.clientY - r.bottom)) <= 22; });

function openMonth() {

  $('mNo').value = mState.no; $('mMonth').value = mState.month;

}
function closeMonth() { closeLandscape(); $('monthView').hidden = true; if (!document.querySelector('.dim.open')) document.body.style.overflow = ''; lastFocus?.focus?.(); }
$('openMonthBtn').addEventListener('click', openMonth);
$('mClose').addEventListener('click', closeMonth);

document.addEventListener('click', e => { if (e.target.closest('#toMonth')) { closeDim('historyModal'); openMonth(); } });

/* dialogs & toast */
let lastFocus = null, onOk = null;
function openDim(id) { lastFocus = document.activeElement; $(id).classList.add('open'); $(id).setAttribute('aria-hidden', 'false'); document.body.style.overflow = 'hidden'; }
function closeDim(id) { $(id).classList.remove('open'); $(id).setAttribute('aria-hidden', 'true'); if (!document.querySelector('.dim.open')) document.body.style.overflow = ''; lastFocus?.focus?.(); }
function askConfirm(title, msg, okLabel, fn) { $('aT').textContent = title; $('aM').textContent = msg; $('aOk').textContent = okLabel; onOk = fn; openDim('alertDim'); $('aCancel').focus(); haptic([20, 40, 20]); }
$('aCancel').addEventListener('click', () => closeDim('alertDim'));
$('aOk').addEventListener('click', () => { closeDim('alertDim'); onOk && onOk(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if ($('alertDim').classList.contains('open')) closeDim('alertDim'); else if ($('historyModal').classList.contains('open')) closeDim('historyModal'); else if (!$('monthView').hidden) closeMonth(); } });
function showToast(msg, err = false) {

  t.querySelector('use').setAttribute('href', err ? '#i-warn' : '#i-checkc'); t.querySelector('span').textContent = msg;
  requestAnimationFrame(() => t.classList.add('show')); clearTimeout(showToast.t); showToast.t = setTimeout(() => t.classList.remove('show'), 2200);
}

new IntersectionObserver(([en]) => $('nav').classList.toggle('scrolled', !en.isIntersecting), { rootMargin: '-44px 0px 0px 0px' }).observe($('largeTitle'));
